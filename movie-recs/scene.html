<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توصيات الأسبوع</title>
<style>
@font-face{font-family:Cairo;font-weight:400;src:url(assets/fonts/cairo-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:Cairo;font-weight:700;src:url(assets/fonts/cairo-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:Cairo;font-weight:900;src:url(assets/fonts/cairo-arabic-900-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+2010-2011,U+204F,U+2E41}
@font-face{font-family:Cairo;font-weight:400;src:url(assets/fonts/cairo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Cairo;font-weight:700;src:url(assets/fonts/cairo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Cairo;font-weight:900;src:url(assets/fonts/cairo-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Bebas;src:url(assets/fonts/bebas-neue-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Amiri;font-style:italic;src:url(assets/fonts/amiri-latin-400-italic.woff2) format('woff2')}

:root{--gold:#E8B84A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden;height:100%}
body{font-family:Cairo,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#000;transform-origin:0 0}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden;perspective:1600px}
.abs{position:absolute}
.ctr{left:0;right:0;text-align:center}
.full{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
img{display:block}
.cat{position:absolute;transform-origin:50% 100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.sticker{position:absolute;border:9px solid #fff;border-radius:18px;box-shadow:0 24px 50px rgba(0,0,0,.55);overflow:hidden;background:#fff}
.sticker img{width:100%;height:auto}
.icon{position:absolute;filter:drop-shadow(0 16px 26px rgba(0,0,0,.45))}
.chip{display:inline-block;padding:10px 30px 14px;border-radius:40px;font-weight:700;font-size:40px;line-height:1.3;color:#111}
.bubble{position:absolute;left:60px;top:70px;width:170px;height:170px;border-radius:50%;background:#f3b800 url(assets/host-cat.png) no-repeat;background-size:280px auto;background-position:-74px 4px}

/* calendar icon: the year is written over the erased header */
.cal{position:absolute;transform-origin:50% 0}
.cal img{width:100%;height:auto}
.cal .yr{position:absolute;left:2.7%;right:2.7%;top:20.7%;height:13.3%;overflow:hidden;font-family:Bebas;color:#fff;direction:ltr;text-align:center;letter-spacing:2px}
.cal .yr span{position:absolute;left:0;right:0;top:0;line-height:1}

/* lanyard badge: film name is written on the card */
.badge{position:absolute;width:250px;transform-origin:50% 0}
.badge img{width:100%;height:auto}
.badge .txt{position:absolute;left:20px;right:20px;top:290px;bottom:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.badge .bt{font-family:Bebas;font-size:50px;line-height:.95;letter-spacing:2px;color:#fff;direction:ltr;text-shadow:0 3px 0 rgba(120,40,0,.35)}
.badge .bl{width:70%;height:4px;border-radius:2px;background:rgba(255,255,255,.75)}
.badge .bm{font-weight:900;font-size:36px;line-height:1.2;color:#3a1200}

/* ---------- intro ---------- */
#i-hall{transform-origin:50% 42%}
#i-dark{position:absolute;inset:0;background:#05030a}
#i-screen{position:absolute;left:180px;top:600px;width:630px;height:360px;border-radius:50%;mix-blend-mode:screen}
#i-beam{position:absolute;inset:0;mix-blend-mode:screen}
.sconce{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.95),rgba(255,170,90,.35) 35%,transparent 70%);mix-blend-mode:screen}
#i-floor{position:absolute;left:140px;top:1700px;width:800px;height:260px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,230,180,.45),transparent 70%)}
.curtain{position:absolute;top:0;bottom:0;width:560px;background:url(assets/curtain.jpg) repeat-x;background-size:auto 1920px}
#cur-l{left:0;background-position:right top;box-shadow:inset -40px 0 60px rgba(0,0,0,.6)}
#cur-r{right:0;background-position:left top;box-shadow:inset 40px 0 60px rgba(0,0,0,.6)}
#i-title{top:220px;font-weight:900;font-size:132px;line-height:1.2;text-shadow:0 8px 40px rgba(0,0,0,.85)}
#i-bar{top:395px;left:290px;width:500px;height:10px;border-radius:5px;background:linear-gradient(90deg,#8a5a12,var(--gold),#fff1c4);transform-origin:right center}
#i-sub{top:420px;font-weight:700;font-size:58px;color:var(--gold);text-shadow:0 4px 20px rgba(0,0,0,.8)}
#i-chips{top:530px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:0 90px}

/* ---------- guess ---------- */
#g-q{transform-origin:528px 822px}
#g-titleA{top:110px;font-weight:900;font-size:128px;color:#111;text-shadow:0 4px 0 rgba(255,255,255,.6)}
#g-b{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#1b3566,#081226 70%)}
#g-incbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,#2a4f8f,#050c1c 72%)}
#g-spot{position:absolute;left:-300px;right:-300px;top:-100px;height:1400px;background:conic-gradient(from 165deg at 50% 0%,transparent,rgba(255,255,255,.10) 15deg,transparent 30deg);mix-blend-mode:screen;transform-origin:50% 0}
#g-title{top:110px;font-weight:900;font-size:120px;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.6)}
#g-hint{position:absolute;top:300px;left:90px;right:90px;background:#fff;color:#0d1a33;border-radius:30px;padding:22px 30px 28px;font-weight:700;font-size:48px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#g-spin{left:485px;top:905px;width:110px;height:110px}
.qcard{position:absolute;width:420px;height:630px;transform-style:preserve-3d}
.qface{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;overflow:hidden}
.qfront{background:linear-gradient(160deg,#fffdf6,#e9e2cf);border:10px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-family:Bebas;font-size:380px;color:#13264a;line-height:1}
.qfront::after{content:"";position:absolute;inset:22px;border:4px dashed rgba(19,38,74,.25);border-radius:16px}
.qback{transform:rotateY(180deg);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 80px rgba(212,164,55,.45)}
.qback img{width:100%;height:100%;object-fit:cover}
#g-name{top:1000px;font-family:Bebas;font-size:150px;letter-spacing:8px;color:var(--gold);direction:ltr;text-shadow:0 6px 40px rgba(212,164,55,.5)}
#g-year{top:1150px;font-family:Bebas;font-size:70px;letter-spacing:6px;color:#fff;direction:ltr}
#g-tags{top:1250px;display:flex;justify-content:center;gap:20px}
#g-tags .chip{background:var(--gold)}

/* ---------- timeline ---------- */
#t-proj{transform-origin:40% 37%}
#t-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,4,10,.72),rgba(6,4,10,.35) 45%,rgba(6,4,10,.6))}
#t-lens{position:absolute;left:343px;top:605px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.95),rgba(255,214,140,.35) 35%,transparent 70%);mix-blend-mode:screen}
#t-tv{transform-origin:50% 40%}
#t-line{left:537px;top:470px;width:6px;height:760px;border-radius:3px;background:linear-gradient(180deg,var(--gold),#c9822f 60%,rgba(201,130,47,.2));transform-origin:50% 0}
.st-dot{position:absolute;left:520px;width:40px;height:40px;border-radius:50%;border:6px solid #0e0b14}
.st-thumb{position:absolute;width:118px;height:177px;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.st-thumb img{width:100%;height:100%;object-fit:cover}
.st-lab{position:absolute;width:330px;direction:ltr}
.st-lab b{display:block;font-family:Bebas;font-size:82px;line-height:.95;letter-spacing:3px;font-weight:400}
.st-lab i{display:block;font-family:Bebas;font-style:normal;font-size:30px;letter-spacing:2px;color:#e6dff2}
#t-arrow{left:330px;top:1065px;width:170px}

/* ---------- film scenes ---------- */
.fhall{position:absolute;inset:0;background:url(assets/bg-hall-blur.jpg) center/cover}
.ftint{position:absolute;inset:0;mix-blend-mode:color;opacity:.85}
.fdark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0),rgba(0,0,0,.42) 78%)}
.fglow{position:absolute;left:40px;top:250px;width:1000px;height:1000px;border-radius:50%;mix-blend-mode:screen}
.fsweep{position:absolute;left:-400px;right:-400px;top:-200px;height:1700px;mix-blend-mode:screen;transform-origin:50% 0}
.yearbig{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:Bebas;font-size:600px;line-height:1;color:transparent;-webkit-text-stroke:4px currentColor;direction:ltr}
.pwrap{position:absolute;left:240px;top:300px;width:600px;height:900px;border-radius:24px;overflow:hidden;transform-style:preserve-3d}
.pwrap img{width:100%;height:100%;object-fit:cover}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%)}
.ttl{position:absolute;left:30px;right:30px;top:1232px;text-align:center;font-family:Bebas;letter-spacing:5px;line-height:1;direction:ltr;white-space:nowrap;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.meta{position:absolute;left:0;right:0;top:1350px;text-align:center;font-weight:700;font-size:42px;color:#fff}
.quote{position:absolute;left:80px;right:80px;top:1440px;border-radius:28px;padding:26px 40px 30px;text-align:center;background:rgba(0,0,0,.38);color:#fff}
.quote p{font-weight:700;font-size:46px;line-height:1.45}
.quote p.en{font-family:Amiri;font-style:italic;font-weight:400;font-size:44px;line-height:1.35;direction:ltr}

/* ---------- outro ---------- */
#o-stage{transform-origin:50% 60%}
#o-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 40%,rgba(0,0,0,.45))}
.ocard{position:absolute;left:430px;top:190px;width:220px;height:330px;border-radius:16px;overflow:hidden;transform-origin:50% 190%;box-shadow:0 20px 50px rgba(0,0,0,.6);border:4px solid rgba(255,255,255,.85)}
.ocard img{width:100%;height:100%;object-fit:cover}
#o-stars{top:640px;display:flex;justify-content:center;gap:16px;direction:ltr}
#o-stars svg{width:78px;height:78px}
#o-rec{top:735px;font-weight:700;font-size:46px;color:#f4e6cf;text-shadow:0 4px 16px rgba(0,0,0,.8)}
#o-q{top:830px;font-weight:900;font-size:124px;color:var(--gold);text-shadow:0 8px 40px rgba(0,0,0,.7)}
#o-bub{left:735px;top:1110px;width:310px}
#o-bub img{width:100%}
#o-bub span{position:absolute;left:0;right:0;top:22%;text-align:center;font-weight:900;font-size:46px;color:#fff}

/* ---------- overlays ---------- */
#fx{position:absolute;left:0;top:0;pointer-events:none}
#wipebar{position:absolute;top:0;bottom:0;width:22px;margin-left:-11px;visibility:hidden}
#cap{position:absolute;left:0;right:0;top:1690px;text-align:center;pointer-events:none}
#cap span{display:inline-block;max-width:960px;padding:12px 34px 18px;border-radius:24px;background:rgba(0,0,0,.62);font-weight:700;font-size:50px;line-height:1.35;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#grain{position:absolute;inset:-64px;opacity:.07;pointer-events:none;mix-blend-mode:overlay}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

#ctl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:10;font:600 15px/1 system-ui,sans-serif;direction:ltr}
#ctl button{border:0;border-radius:22px;padding:11px 20px;background:#E8B84A;color:#111;font:inherit;cursor:pointer}
#ctl span{color:#ddd;min-width:84px}
body.render #ctl{display:none}
</style>
</head>
<body>
<div id="stage">

  <!-- 1. intro: the hall, curtains open, house lights dim, the screen lights up -->
  <section class="scene" id="s-intro">
    <img id="i-hall" class="full" src="assets/bg-hall.jpg" alt="">
    <div class="sconce" style="left:142px;top:760px"></div><div class="sconce" style="left:838px;top:760px"></div>
    <div class="sconce" style="left:1009px;top:686px"></div><div class="sconce" style="left:1066px;top:706px"></div>
    <div id="i-dark"></div>
    <div id="i-screen"></div>
    <div id="i-beam"></div>
    <div id="i-floor"></div>
    <img id="i-cat" class="cat" src="assets/host-cat.png" alt="" style="width:646px;left:217px;top:1060px">
    <div id="i-title" class="abs ctr">توصيات الأسبوع</div>
    <div id="i-bar" class="abs"></div>
    <div id="i-sub" class="abs ctr">خمسة أفلام · خمسة أمزجة</div>
    <div id="i-chips" class="abs ctr"></div>
    <div class="curtain" id="cur-l"></div>
    <div class="curtain" id="cur-r"></div>

  <!-- 2. guessing game: yellow question board, zoom through the "?" into the card game -->
  <section class="scene" id="s-guess">
    <img id="g-q" class="full" src="assets/bg-question.jpg" alt="">
    <div id="g-titleA" class="abs ctr">خمّنوا الفيلم</div>
    <div id="g-b">
      <div id="g-incbg"></div>
      <div id="g-spot"></div>
      <div id="g-title" class="abs ctr">خمّنوا الفيلم</div>
      <div id="g-hint">يدور عن سرقة أشياء داخل الأحلام</div>
      <img id="g-spin" class="abs" src="assets/spinner.png" alt="">
      <div id="g-cards"></div>
      <div id="g-name" class="abs ctr">INCEPTION</div>
      <div id="g-year" class="abs ctr">2010</div>
      <div id="g-tags" class="abs ctr"><span class="chip">خيال علمي</span><span class="chip">تشويق</span></div>
      <div class="bubble" id="g-bubble"></div>
      <div class="sticker" id="g-point" style="left:735px;top:1335px;width:270px"><img src="assets/st-pointing.jpg" alt=""></div>
      <img id="g-cat" class="cat" src="assets/host-cat.png" alt="" style="width:617px;left:470px;top:1100px">
    </div>
  </section>

  <!-- 3. timeline: projector room, calendar counter, then the films land on the TV -->
  <section class="scene" id="s-time">
    <img id="t-proj" class="full" src="assets/bg-projector.jpg" alt="">
    <div id="t-shade"></div>
    <div id="t-lens"></div>
    <img id="t-tv" class="full" src="assets/bg-tv.jpg" alt="">
    <div class="cal" id="t-cal" style="left:370px;top:40px;width:340px"><img src="assets/calendar.png" alt=""><div class="yr" style="font-size:54px"><span></span><span></span></div></div>
    <div id="t-line" class="abs"></div>
    <div id="t-stations"></div>
    <img id="t-arrow" class="icon" src="assets/arrow.png" alt="">
    <img id="t-cat" class="cat" src="assets/host-cat.png" alt="" style="width:451px;left:10px;top:1320px">
  </section>

  <!-- 4-8. film scenes are generated from FILMS below -->
  <div id="films"></div>

  <!-- 9. outro on the stage -->
  <section class="scene" id="s-outro">
    <img id="o-stage" class="full" src="assets/bg-stage.jpg" alt="">
    <div id="o-shade"></div>
    <div id="o-fan"></div>
    <div id="o-stars" class="abs ctr"></div>
    <div id="o-rec" class="abs ctr">أنصح بها كلها</div>
    <div id="o-q" class="abs ctr">أيها شاهدتموه؟</div>
    <div class="sticker" id="o-ghost" style="left:855px;top:70px;width:190px"><img src="assets/st-ghost.jpg" alt=""></div>
    <img id="o-statue" class="icon" src="assets/statue-thumbs.png" alt="" style="left:-40px;top:1250px;width:430px">
    <div class="sticker" id="o-phone" style="left:350px;top:1150px;width:370px;border-color:#ff8a2a"><img src="assets/st-phone.jpg" alt=""></div>
    <div id="o-bub" class="abs"><img src="assets/bubble-line.png" alt=""><span>شاركنا رأيك</span></div>
    <img id="o-cat" class="cat" src="assets/host-cat.png" alt="" style="width:601px;left:450px;top:1120px">
  </section>

  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="wipebar"></div>
  <div id="vig"></div>

</div>

<div id="ctl"><button id="play">▶ تشغيل</button><button id="restart">⟲</button><span id="clock">0.0s</span></div>
<audio id="aud" src="mix.wav" preload="auto"></audio>

<script src="assets/env.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 57.5, WIPE = 0.55;
const $ = s => document.querySelector(s);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  inout: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  bounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; }
};
const P = (t, a, b, e = E.out) => e(cl((t - a) / (b - a)));
const bump = (t, c, w = .4) => { const x = (t - c) / w; return x < 0 || x > 1 ? 0 : Math.sin(Math.PI * x); };
const hash = (i, k) => { const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return s - Math.floor(s); };
const voice = t => { const e = window.ENV || []; const i = Math.floor(t * FPS);
  return ((e[i - 1] || 0) + 2 * (e[i] || 0) + (e[i + 1] || 0)) / 4; };
const reveal = (el, p, rtl = true) => { el.style.clipPath = rtl ? `inset(-20% 0 -20% ${(1 - p) * 100}%)` : `inset(-20% ${(1 - p) * 100}% -20% 0)`; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => `rgba(${hex(h).join(',')},${a})`;
function st(el, o) { for (const k in o) el.style[k] = o[k]; }
// pop in at a, pop out at b (scale with overshoot); returns 0..1 visibility
function popInOut(el, t, a, b, base = '', d = .45) {
  const pi = P(t, a, a + d, E.back), po = P(t, b - .3, b, E.in);
  st(el, { opacity: cl(pi * 2) * (1 - po), transform: `${base} scale(${pi * (1 - po)})`, visibility: t < a || t > b ? 'hidden' : 'inherit' });
}
// reveal a line drawing from its starting corner (top-right)
const draw = (el, p) => { el.style.clipPath = `inset(0 0 ${(1 - p) * 100}% ${(1 - p) * 100}%)`; };

/* ---------- data ---------- */
const FILMS = [
  { id: 'groundhog', title: 'GROUNDHOG DAY', year: 1993, genre: 'كوميدي', mood: 'ضحك', c1: '#d9efff', c2: '#2d6e9e', acc: '#FF4D61', fx: 'snow',
    quote: 'يوم واحد يتكرر... حتى تتغير' },
  { id: 'shawshank', title: 'THE SHAWSHANK REDEMPTION', year: 1994, genre: 'دراما', mood: 'تأمل وأمل', c1: '#e3a24f', c2: '#3a1f0a', acc: '#F3C27A', fx: 'rain',
    quote: 'Hope is a good thing, maybe the best of things, and no good thing ever dies.', en: true },

/* calendar year: the new year slides up over the old one */
function setYear(cal, years, times, t) {
  let k = 0; for (let i = 0; i < times.length; i++) if (t >= times[i]) k = i;
  const p = P(t, times[k], times[k] + .3, E.back), spans = cal.querySelectorAll('.yr span');
  spans[0].textContent = years[k]; spans[1].textContent = k > 0 ? years[k - 1] : '';
  spans[0].style.transform = `translateY(${(1 - p) * 110}%)`; spans[1].style.transform = `translateY(${-p * 110}%)`;
  return k > 0 ? bump(t, times[k], .35) : 0;

  const pa = P(t, 20.2, 20.95, E.inout); draw($('#t-arrow'), pa);
  st($('#t-arrow'), { opacity: gone, transform: `rotate(180deg)` });
  const pin = P(t, 19.1, 19.8, E.out), pout = P(t, 23.3, 23.8, E.in);
  st($('#t-cat'), { transform: `translate(${-500 * (1 - pin) - 520 * pout}px, ${-6 * v}px) rotate(${-0.8 * v}deg)` });
};

FILMS.forEach((f, i) => {
  R['f-' + i] = (el, t) => {
    const s = SCENES[3 + i], lt = t - s.a, dur = SCENES[4 + i].a - s.a, v = voice(t);
    const q = el._q || (el._q = { y: el.querySelector('.yearbig'), b: el.querySelector('.bubble'), cw: el.querySelector('.calw'), cal: el.querySelector('.cal'),
      p: el.querySelector('.pwrap'), sh: el.querySelector('.sheen'), tt: el.querySelector('.ttl'), m: el.querySelector('.meta'), qu: el.querySelector('.quote'),
      qp: el.querySelector('.quote p'), bd: el.querySelector('.badge'), gl: el.querySelector('.fglow'), sw: el.querySelector('.fsweep'), cm: [...el.querySelectorAll('.cameo')] });
    const shx = f.shake ? (hash(Math.floor(t * 24), 1) - .5) * 14 * (0.5 + v) : 0, shy = f.shake ? (hash(Math.floor(t * 24), 2) - .5) * 14 * (0.5 + v) : 0;
    // lighting of the hall changes with the film
    st(q.gl, { opacity: 0.7 + 0.3 * Math.sin(lt * 2.4) * (f.shake ? hash(Math.floor(t * 10), 3) : 1) });
    q.sw.style.transform = `rotate(${Math.sin(lt * 0.9 + i) * 14}deg)`;
    const py = P(lt, .1, .9); st(q.y, { opacity: 0.14 * py, transform: `translateY(${-lt * 14}px) scale(${1.25 - 0.25 * py})` });
    const pb = P(lt, .25, .7, E.back);
    st(q.b, { opacity: cl(pb * 2), transform: `scale(${pb * (1 + 0.07 * v)})`, boxShadow: `0 0 0 7px ${f.acc}, 0 0 ${20 + 50 * v}px ${f.acc}` });
    // calendar icon drops in on its rings and swings
    const pc = P(lt, .3, .8, E.back), sw = Math.sin(lt * 4) * 9 * Math.exp(-lt * 1.6);
    setYear(q.cal, [f.year], [0], t);
    st(q.cw, { opacity: cl(pc * 2), transform: `translateY(${-260 * (1 - pc)}px) rotate(${sw}deg)` });
    // lanyard badge drops and swings
    const pd = P(lt, .2, .8, E.back), swb = Math.sin(lt * 3.4) * 7 * Math.exp(-lt * 1.1);
    st(q.bd, { transform: `translateY(${-680 * (1 - pd)}px) rotate(${swb + shx * .2}deg)` });
    const pp = P(lt, .12, 1.0, E.back), pe = cl(P(lt, .12, 1.0));
    st(q.p, { opacity: cl(pe * 2), transform: `translate(${shx}px, ${260 * (1 - pp) + shy}px) rotateX(${28 * (1 - pe)}deg) rotateY(${-18 * (1 - pe) + 4 * Math.sin(lt * 1.3)}deg) scale(${(0.8 + 0.2 * pp) * (1 + 0.035 * lt / dur)})`,
      boxShadow: `0 40px 90px rgba(0,0,0,.55), 0 0 ${50 + 30 * Math.sin(lt * 2)}px ${rgba(f.acc, .55)}` });
    q.sh.style.transform = `translateX(${lerp(-150, 150, P(lt, 1.0, 1.8, E.inout))}%)`;
    const pt = P(lt, .55, 1.05); reveal(q.tt, pt, false); q.tt.style.transform = `translate(${shx * .5}px, ${30 * (1 - pt)}px)`;
    const pm = P(lt, .75, 1.2); st(q.m, { opacity: pm, transform: `translateY(${20 * (1 - pm)}px)` });
    const pq = P(lt, 1.0, 1.5, E.back); st(q.qu, { opacity: cl(pq * 2), transform: `translateY(${40 * (1 - pq)}px)` });
    reveal(q.qp, P(lt, 1.15, f.en ? 2.4 : 1.9, E.inout), !f.en);
    // cameo icons
    CAMEOS[i].forEach(([type, , , a, b, rot], k) => {
      const c = q.cm[k];
      if (type === 'draw') { draw(c, P(t, a, a + .7, E.inout)); st(c, { opacity: 1 - P(t, b - .3, b), visibility: t < a || t > b ? 'hidden' : 'inherit' }); }
      else if (type === 'neon') {   // flickers on like a real tube
        const on = t < a ? 0 : (t < a + .5 ? (hash(Math.floor(t * 30), 9) > .45 ? 1 : .15) : 1) * (1 - P(t, b - .3, b));
        st(c, { opacity: on, visibility: t < a || t > b ? 'hidden' : 'inherit', transform: `rotate(${Math.sin(t * 1.5) * 2}deg)`, transformOrigin: '50% 0' });
      } else popInOut(c, t, a, b, `rotate(${rot + Math.sin(t * 2.2) * 3}deg)`);
    });
  };
});

R['s-outro'] = (el, t) => {
  const v = voice(t);
  st($('#o-stage'), { transform: `scale(${lerp(1.12, 1.0, P(t, 50.95, 57.5, E.out))})`, filter: `brightness(${0.9 + 0.1 * Math.sin(t * 3)})` });
  const ANG = [-28, -14, 0, 14, 28];
  [...el.querySelectorAll('.ocard')].forEach((c, i) => { const p = P(t, 51.0 + i * 0.12, 51.55 + i * 0.12, E.back);
    st(c, { opacity: cl(p * 2), transform: `translateY(${300 * (1 - p)}px) rotate(${ANG[i] * p + Math.sin(t * 1.5 + i) * 1.2}deg) scale(${0.6 + 0.4 * p})` }); });
  [...$('#o-stars').children].forEach((s, i) => { const p = P(t, 51.9 + i * 0.13, 52.25 + i * 0.13, E.back);
    st(s, { opacity: cl(p * 2), transform: `scale(${p}) rotate(${(1 - p) * -90}deg)` }); });
  const pr = P(t, 52.0, 52.4); st($('#o-rec'), { opacity: pr, transform: `translateY(${16 * (1 - pr)}px)` });
  const pq = P(t, 52.58, 53.1, E.back); st($('#o-q'), { opacity: cl(pq * 2), transform: `scale(${pq * (1 + 0.03 * Math.sin(t * 4))})` });
  popInOut($('#o-statue'), t, 52.05, 57.5, `rotate(${-4 + Math.sin(t * 2) * 3}deg)`);
  popInOut($('#o-ghost'), t, 52.65, 57.5, `rotate(${9 + Math.sin(t * 2.4) * 3}deg)`);
  const ph = P(t, 52.2, 52.85, E.back), pgo = P(t, 54.2, 54.7, E.in);
  st($('#o-cat'), { transform: `translate(${640 * pgo}px, ${(1 - ph) * 900 - 10 * v}px) rotate(${1.1 * v + 8 * pgo}deg)` });
  const pf = P(t, 54.35, 54.95, E.back);
  st($('#o-phone'), { opacity: cl(pf * 2), transform: `translateY(${(1 - pf) * 700}px) rotate(${-5 + Math.sin(t * 2) * 2}deg)` });
  const pbw = P(t, 54.8, 55.5, E.inout); draw($('#o-bub img'), pbw);
  st($('#o-bub span'), { opacity: P(t, 55.3, 55.7) }); $('#o-bub').style.visibility = t > 54.8 ? 'inherit' : 'hidden';
  $('#black').style.opacity = P(t, 56.7, 57.45, E.in);
};

/* ---------- master render ---------- */
const sceneEls = SCENES.map(s => document.getElementById(s.id));
function render(t) {
  t = cl(t, 0, DUR);
  let ci = 0; for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i].a) ci = i;
  const pw = ci > 0 ? cl((t - SCENES[ci].a) / WIPE) : 1, wiping = pw < 1, bx = W * (1 - E.inout(pw));
  sceneEls.forEach((el, i) => {
    const vis = i === ci || (wiping && i === ci - 1);
    el.style.visibility = vis ? 'visible' : 'hidden'; el.style.zIndex = i;
    if (!vis) return;
    el.style.clipPath = (i === ci && wiping) ? `inset(0 0 0 ${bx}px)` : 'none';
    R[SCENES[i].id](el, t);
  });
  const wb = $('#wipebar');
  if (wiping) st(wb, { visibility: 'visible', left: bx + 'px', background: SCENES[ci].acc, boxShadow: `0 0 40px ${SCENES[ci].acc}`, zIndex: 50 });
  else wb.style.visibility = 'hidden';
  ctx.clearRect(0, 0, W, H);
  const dr = (i, x0, x1) => { ctx.save(); ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, H); ctx.clip(); particles(SCENE_FX[SCENES[i].id], t); ctx.restore(); };
  if (wiping) { dr(ci - 1, 0, bx); dr(ci, bx, W); } else dr(ci, 0, W);
  burst(t, 14.0, 540, 615);
  $('#fx').style.zIndex = 40;
  const cap = CAPS.find(c => t >= c[0] && t < c[1]), cs = $('#cap span');
  if (cap) { if (cs.textContent !== cap[2]) cs.textContent = cap[2]; const p = P(t, cap[0], cap[0] + .22, E.back);
    st($('#cap'), { opacity: cl(p * 2) * (1 - P(t, cap[1] - .12, cap[1])), transform: `scale(${0.9 + 0.1 * p})`, zIndex: 60 }); }
  else $('#cap').style.opacity = 0;
  $('#vig').style.zIndex = 55;
  const f = Math.floor(t * FPS); st($('#grain'), { zIndex: 70, transform: `translate(${Math.floor(hash(f, 1) * 64)}px, ${Math.floor(hash(f, 2) * 64)}px)` });
  $('#black').style.zIndex = 80;
}
window.render = render;

/* ---------- boot ---------- */
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
Promise.all([
  document.fonts.load('900 60px Cairo', 'توصيات'), document.fonts.load('700 60px Cairo', 'توصيات 1993'), document.fonts.load('60px Bebas', 'A'), document.fonts.load('italic 40px Amiri', 'A'),
  ...[...document.images].map(im => im.decode().catch(() => {})),
  ...['bg-hall-blur.jpg', 'host-cat.png'].map(n => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = 'assets/' + n; })),
]).then(() => document.fonts.ready).then(() => { render(0); window.ready = true; });

if (!isRender) {
  const stage = $('#stage'), aud = $('#aud');
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 70) / H); st(stage, { transform: `scale(${s})`, left: (innerWidth - W * s) / 2 + 'px', top: '0px' }); };
  addEventListener('resize', fit); fit();
  const loop = () => { render(aud.currentTime); $('#clock').textContent = aud.currentTime.toFixed(1) + 's'; if (!aud.paused) requestAnimationFrame(loop); };
  $('#play').onclick = () => { if (aud.paused) { aud.play(); $('#play').textContent = '❚❚ إيقاف'; loop(); } else { aud.pause(); $('#play').textContent = '▶ تشغيل'; } };
  $('#restart').onclick = () => { aud.currentTime = 0; render(0); };
  aud.onended = () => { $('#play').textContent = '▶ تشغيل'; };
}
</script>
</body>
