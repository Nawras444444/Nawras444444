<script>
// John Wick: 60s fan-made tribute, 2D canvas. The character is a silhouette (no actor likeness).

// ===== BEATS: every time lives here, re-timing is a one-line change =====

  ['بس لما يلمسوا آخر شيء يربطك بالحياة...', 18.8, 23.6],

const W = 1920, H = 1080, q = new URLSearchParams(location.search), SCALE = parseFloat(q.get('scale') || '1');

const C = { bk: '#07080B', gold: '#D9B45A', red: '#C8102E', blue: '#3B6FD9', amber: '#F2B46B', ink: '#020203' };
const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE; const MAIN = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return c; };
const WORK = mk(), ACC = mk();

// ===== helpers =====
const clamp01 = v => Math.max(0, Math.min(1, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp01((t - a) / (b - a));

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, Math.PI * 2); g.fill(); }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }
function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); }
function glow(g, x, y, r, col, a) { if (a <= 0.002) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(col, a)); gr.addColorStop(1, rgba(col, 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function vignette(g, a) { const gr = g.createRadialGradient(W / 2, H / 2, 420, W / 2, H / 2, 1250); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }

function rim(g, col, dx, dy, blur, fn) {   // light along one edge of a silhouette: two offset copies under it (no blur filter, which is slow)
  g.save(); g.globalAlpha = 0.35; g.translate(dx * 1.7, dy * 1.7); fn(col); g.restore(); g.save(); g.translate(dx, dy); fn(col); g.restore(); g.globalAlpha = 1;
}
function rain(g, t, n, speed, col, len, lw, seed, slant = 0.12) {
  g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.beginPath();
  for (let i = 0; i < n; i++) { const sp = speed * (0.8 + 0.4 * hash(i, seed + 3)), y = ((hash(i, seed + 2) * 1300 + t * sp) % 1300) - 110, x = hash(i, seed + 1) * 2200 - 140 - y * slant; g.moveTo(x, y); g.lineTo(x - len * slant, y + len); }
  g.stroke();
}

// Arabic line: word by word (right to left), each word fades up from blurred to sharp with a small rise. No letter spacing (it breaks the joins).
function arText(g, str, cx, cy, size, weight, color, tIn, tOut, t, o = {}) {
  const st = o.stagger ?? 0.09, dur = o.dur ?? 0.6, rise = o.rise ?? 22, maxW = o.maxW ?? 1500, lh = o.lh ?? size * 1.7;
  g.font = `${weight} ${size}px AR`; g.direction = 'rtl'; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  const ws = str.split(' '), sp = g.measureText(' ').width, wd = ws.map(w => g.measureText(w).width), lines = []; let cur = [], cw = 0;
  ws.forEach((w, i) => { const add = cur.length ? sp + wd[i] : wd[i]; if (cur.length && cw + add > maxW) { lines.push(cur); cur = []; cw = 0; } cw += cur.length ? sp + wd[i] : wd[i]; cur.push(i); });
  if (cur.length) lines.push(cur);
  lines.forEach((ln, li) => {
    const tot = ln.reduce((a, i) => a + wd[i], 0) + sp * (ln.length - 1); let x = cx + tot / 2; const y = cy + (li - (lines.length - 1) / 2) * lh;
    ln.forEach(i => {
      const pin = outCubic(prog(t, tIn + i * st, tIn + i * st + dur)), pout = sine(prog(t, tOut + i * st * 0.5, tOut + i * st * 0.5 + dur * 0.7)), a = pin * (1 - pout);
      if (a > 0.003) { g.globalAlpha = a; const b = (1 - a) * 12 * SCALE; g.filter = b > 0.3 ? `blur(${b}px)` : 'none'; g.fillStyle = (o.colors && o.colors[ws[i]]) || color; g.fillText(ws[i], x, y + (1 - pin) * rise - pout * rise * 0.5); }
      x -= wd[i] + sp;
    });
  });
  g.globalAlpha = 1; g.filter = 'none'; g.direction = 'ltr';
}
function latin(g, str, cx, cy, size, color, tIn, tOut, t) {
  const a = outCubic(prog(t, tIn, tIn + 0.6)) * (1 - sine(prog(t, tOut, tOut + 0.5))); if (a <= 0.003) return;
  g.globalAlpha = a; g.font = `400 ${size}px UI`; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = color; g.fillText(str, cx, cy + (1 - a) * 10); g.globalAlpha = 1;
}

// ===== the character and the symbols, all drawn as vector silhouettes (our own drawings) =====
function manFront(g, x, y, s, o = {}) {   // standing, facing camera, ~990 units tall, feet at (x, y)
  const f = o.fill || '#000', lift = o.lift || [0, 0];
  g.save(); g.translate(x, y + (o.bob || 0) * s); g.scale(s, s); g.fillStyle = f;
  g.beginPath(); g.moveTo(-104, -440); g.lineTo(-6, -440); g.lineTo(-14, -34 - lift[0]); g.lineTo(-94, -34 - lift[0]); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(104, -440); g.lineTo(6, -440); g.lineTo(14, -34 - lift[1]); g.lineTo(94, -34 - lift[1]); g.closePath(); g.fill();
  rr(g, -106, -42 - lift[0], 94, 42, 14); rr(g, 12, -42 - lift[1], 94, 42, 14);
  g.beginPath(); g.moveTo(-26, -812); g.lineTo(-126, -792); g.bezierCurveTo(-150, -786, -156, -748, -154, -706); g.lineTo(-156, -470); g.lineTo(-112, -466); g.lineTo(-114, -428);
  g.lineTo(114, -428); g.lineTo(112, -466); g.lineTo(156, -470); g.lineTo(154, -706); g.bezierCurveTo(156, -748, 150, -786, 126, -792); g.lineTo(26, -812); g.closePath(); g.fill();
  ell(g, -134, -446, 21, 30); ell(g, 134, -446, 21, 30);
  g.fillRect(-20, -858, 40, 60); ell(g, 0, -902, 48, 62);
  g.beginPath(); g.moveTo(-64, -905); g.bezierCurveTo(-72, -990, 72, -990, 64, -905); g.bezierCurveTo(70, -860, 76, -820, 62, -790); g.lineTo(40, -800);
  g.bezierCurveTo(44, -840, 40, -872, 30, -884); g.lineTo(-30, -884); g.bezierCurveTo(-40, -872, -44, -840, -40, -800); g.lineTo(-62, -790); g.bezierCurveTo(-76, -820, -70, -860, -64, -905); g.closePath(); g.fill();
  if (o.shirt) { g.fillStyle = o.shirt; poly(g, [[-24, -810], [24, -810], [0, -690]]); g.fillStyle = f; poly(g, [[-9, -804], [9, -804], [13, -706], [0, -676], [-13, -706]]); }
  g.restore();
}
function seated(g, x, y, s, o = {}) {   // side view, facing right, in an armchair
  const f = o.fill || '#000'; g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = f; g.strokeStyle = f;
  rr(g, -190, -560, 74, 560, 22); rr(g, -190, -262, 350, 96, 20); rr(g, -160, -372, 300, 52, 22); g.fillRect(118, -170, 26, 170); g.fillRect(-186, -170, 26, 170);
  poly(g, [[-112, -596], [8, -598], [44, -300], [-118, -290]]); rr(g, -118, -336, 270, 96, 44);
  poly(g, [[118, -326], [178, -330], [192, -34], [136, -34]]); rr(g, 128, -42, 104, 40, 16);
  g.lineWidth = 58; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-34, -548); g.lineTo(-22, -392); g.lineTo(104, -384); g.stroke(); ell(g, 124, -384, 30, 22);
  g.fillRect(-58, -640, 40, 60); ell(g, -36, -690, 48, 60);
  g.beginPath(); g.moveTo(-80, -700); g.bezierCurveTo(-86, -772, 10, -782, 14, -712); g.lineTo(-10, -716); g.bezierCurveTo(-40, -722, -50, -690, -56, -640); g.lineTo(-94, -598); g.bezierCurveTo(-102, -640, -94, -680, -80, -700); g.closePath(); g.fill();

}
function puppy(g, x, y, s, o = {}) {   // lying down, facing left toward the chair
  const f = o.fill || '#000', br = o.breath || 1; g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = f; g.strokeStyle = f;
  g.lineWidth = 14; g.lineCap = 'round'; g.beginPath(); g.moveTo(118, -62); g.quadraticCurveTo(170, -80, 182, -128); g.stroke();
  g.save(); g.translate(0, -10); g.scale(1, br); ell(g, 0, -42, 128, 56); g.restore();
  ell(g, 86, -52, 64, 52); rr(g, -210, -34, 120, 32, 14); rr(g, 40, -30, 110, 28, 12);
  ell(g, -128, -100, 54, 48); ell(g, -184, -84, 40, 28);
  g.save(); g.translate(-112, -92); g.rotate(0.25); ell(g, 0, 10, 24, 46); g.restore();
  g.restore();
}
function fist(g, x, y, s, o = {}) {   // close-up: suit sleeve, shirt cuff, clenched fist
  const f = o.fill || '#000'; g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = f;
  poly(g, [[-1300, -150], [-250, -178], [-214, 170], [-1300, 210]]);
  g.beginPath(); g.moveTo(-232, -150); g.bezierCurveTo(-120, -196, 40, -204, 150, -176);
  [[-120, 40], [-46, 38], [26, 37], [96, 34]].forEach(([cy, r], i) => { g.arc(196 - i * 6, cy, r + 6, -Math.PI * 0.62, Math.PI * 0.5); });
  g.bezierCurveTo(150, 168, 60, 172, 0, 168); g.lineTo(-210, 160); g.closePath(); g.fill();
  if (o.detail) {
    g.fillStyle = '#41454f'; poly(g, [[-264, -176], [-238, -177], [-204, 168], [-228, 170]]);
    g.strokeStyle = '#191b22'; g.lineWidth = 5; g.lineCap = 'round';
    g.strokeStyle = '#262a33'; g.lineWidth = 4; for (let k = 0; k < 3; k++) { const yy = -83 + k * 72; g.beginPath(); g.moveTo(110, yy); g.quadraticCurveTo(190, yy - 6, 236 - k * 6, yy + 2); g.stroke(); }
    g.fillStyle = '#0b0c10'; g.beginPath(); g.moveTo(-80, -10); g.bezierCurveTo(0, -60, 120, -62, 176, -34); g.bezierCurveTo(206, -18, 198, 18, 168, 22); g.bezierCurveTo(90, 30, 0, 44, -70, 52); g.closePath(); g.fill();
    g.strokeStyle = '#3a4feb'; g.globalAlpha = 0.55; g.lineWidth = 3; g.beginPath(); g.moveTo(-60, -22); g.bezierCurveTo(10, -62, 120, -64, 176, -34); g.stroke(); g.globalAlpha = 1;
    g.strokeStyle = '#1e2129'; g.lineWidth = 3; g.beginPath(); g.moveTo(176, -34); g.bezierCurveTo(206, -18, 198, 18, 168, 22); g.bezierCurveTo(90, 30, 0, 44, -70, 52); g.stroke();

}
function coinFace(g, r) {
  const gr = g.createLinearGradient(-r, -r, r, r); gr.addColorStop(0, '#F6DA92'); gr.addColorStop(0.5, '#D9B45A'); gr.addColorStop(1, '#7E5E1C');
  g.fillStyle = gr; ell(g, 0, 0, r, r);
  g.strokeStyle = 'rgba(88,62,18,0.85)'; g.lineWidth = r * 0.05; g.beginPath(); g.arc(0, 0, r * 0.83, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, r * 0.4, 0, 7); g.stroke();
  g.lineWidth = r * 0.025; g.beginPath(); for (let k = 0; k < 28; k++) { const a = k / 28 * Math.PI * 2; g.moveTo(Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88); g.lineTo(Math.cos(a) * r * 0.96, Math.sin(a) * r * 0.96); } g.stroke();
  g.fillStyle = 'rgba(110,80,26,0.6)'; ell(g, 0, 0, r * 0.17, r * 0.17);
}
function coinSpin(g, x, y, r, c) {   // a coin turning about its vertical axis; c = cos(angle)
  const sx = Math.max(0.03, Math.abs(c)), th = r * 0.11 * Math.sqrt(Math.max(0, 1 - c * c)), side = Math.sign(c) || 1;
  g.fillStyle = '#6e5118'; ell(g, x + th * side, y, r * sx, r); g.fillRect(Math.min(x, x + th * side), y - r, th, 2 * r);
  g.save(); g.translate(x, y); g.scale(sx, 1); coinFace(g, r); g.restore();
  g.lineWidth = 3; g.strokeStyle = rgba(C.red, 0.7); g.beginPath(); g.ellipse(x, y, r * sx, r, 0, Math.PI / 2, Math.PI * 1.5); g.stroke();
  g.strokeStyle = rgba(C.blue, 0.7); g.beginPath(); g.ellipse(x, y, r * sx, r, 0, -Math.PI / 2, Math.PI / 2); g.stroke();
}
function coinTilt(g, x, y, rx, ry, rot, r) {   // a coin seen at an angle (lying or wobbling)
  const th = Math.min(r * 0.1, r * 0.1 * Math.sqrt(Math.max(0, 1 - (ry / rx) ** 2)));
  g.fillStyle = '#6e5118'; g.save(); g.translate(x, y + th); g.rotate(rot); ell(g, 0, 0, rx, ry); g.restore();
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(rx / r, ry / r); coinFace(g, r); g.restore();

function pencil2D(g, x, y, len, ang, a = 1) {
  g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(ang); const w = len * 0.07;
  g.fillStyle = '#3a3f4d'; g.fillRect(-len / 2, -w / 2, len * 0.78, w); g.fillStyle = '#4a5061'; g.fillRect(-len / 2, -w / 2, len * 0.78, w * 0.3);
  g.fillStyle = '#9aa0ab'; g.fillRect(-len / 2 - len * 0.06, -w / 2, len * 0.06, w);
  g.fillStyle = '#c9a77a'; poly(g, [[len * 0.28, -w / 2], [len / 2, 0], [len * 0.28, w / 2]]); g.fillStyle = '#15161a'; poly(g, [[len * 0.43, -w * 0.16], [len / 2, 0], [len * 0.43, w * 0.16]]);
  g.restore(); g.globalAlpha = 1;

// a pencil in 3D: a hexagonal prism, a metal ferrule, a sharpened wood cone and a graphite tip
function pencil3D(g, yaw, pitch, R, o) {
  const f = 1400, D = 1400, shrink = o.shrink ?? 1, PS = 1.6;   // PS: pencil size
  const ring = (x, r) => Array.from({ length: 6 }, (_, k) => { const a = k * Math.PI / 3 + Math.PI / 6; return [x, r * Math.cos(a), r * Math.sin(a)]; });
  const rot = p => { const x = p[0], y = p[1], z = p[2]; const x1 = x * Math.cos(yaw) + z * Math.sin(yaw), z1 = -x * Math.sin(yaw) + z * Math.cos(yaw); return [x1, y * Math.cos(pitch) - z1 * Math.sin(pitch), y * Math.sin(pitch) + z1 * Math.cos(pitch)]; };
  const tf = p => rot([(210 + (p[0] - 210) * shrink) * PS, p[1] * shrink * PS, p[2] * shrink * PS]);
  const pr = p => [o.cx + f * p[0] / (D + p[2]) + o.dx, o.cy + f * p[1] / (D + p[2]) + o.dy];
  const A = ring(-210, R), Bm = ring(-178, R), Cb = ring(150, R), G = ring(192, R * 0.3), tip = [210, 0, 0];
  const faces = [];
  const side = (P, Q, col) => { for (let k = 0; k < 6; k++) { const k2 = (k + 1) % 6, b = k * Math.PI / 3 + Math.PI / 3; faces.push({ p: [P[k], P[k2], Q[k2], Q[k]], n: [0, Math.cos(b), Math.sin(b)], col }); } };
  side(A, Bm, [170, 176, 188]); side(Bm, Cb, [58, 64, 80]);
  for (let k = 0; k < 6; k++) { const k2 = (k + 1) % 6, b = k * Math.PI / 3 + Math.PI / 3, nx = 0.18; faces.push({ p: [Cb[k], Cb[k2], tip], n: [nx, Math.cos(b), Math.sin(b)], col: [201, 167, 122], z: 0 }); faces.push({ p: [G[k], G[k2], tip], n: [nx, Math.cos(b), Math.sin(b)], col: [28, 29, 34], top: 1 }); }
  faces.push({ p: A.slice(), n: [-1, 0, 0], col: [120, 124, 134] });
  const L = (v => { const l = Math.hypot(...v); return v.map(c => c / l); })([-0.5, -0.8, -0.45]);
  const vis = faces.map(fc => {
    const P = fc.p.map(tf), n = rot(fc.n), cz = P.reduce((a, p) => a + p[2], 0) / P.length, cx = P.reduce((a, p) => a + p[0], 0) / P.length, cy = P.reduce((a, p) => a + p[1], 0) / P.length;
    const facing = n[0] * cx + n[1] * cy + n[2] * (cz + D) < 0, lit = 0.3 + 0.7 * Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);

  return pr(tf(tip));
}

// ===== scenes =====
function alley(g, t) {   // shot 1: the alley, one slow push that ends in the hand, then black

    const ts = SUB === 1 ? t : Math.max(0, Math.min(B.END - 1e-3, t + (i / (SUB - 1) - 0.5) * SHUTTER)), g = WORK.getContext('2d');
    g.setTransform(SCALE, 0, 0, SCALE, 0, 0); g.globalAlpha = 1; g.filter = 'none'; g.direction = 'ltr'; scene(g, ts);
    A.globalAlpha = 1 / (i + 1); A.drawImage(WORK, 0, 0);
  }
  MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1; MAIN.drawImage(ACC, 0, 0);
}
