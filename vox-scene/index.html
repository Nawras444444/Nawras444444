<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vox Style Motion Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@800;900&family=Tajawal:wght@500;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* =====================================================================
   PALETTE  (edit here)
   ===================================================================== */
:root{
  --studio:#0e0e0e;
  --paper:#f5f1e8;
  --ink:#1a1a1a;
  --red:#d62828;
  --gold:#f4a261;
  --teal:#2a9d8f;
  --head-font:'Oswald','Anton','Tajawal',sans-serif;
  --serif-font:'Playfair Display','Amiri',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--studio);color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

/* ---------- Stage area ---------- */
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;perspective:1600px}
#stage{
  position:relative;overflow:hidden;background:var(--paper);
  container-type:size;box-shadow:0 20px 70px rgba(0,0,0,.7);
  transform-style:preserve-3d;
}
.layer{position:absolute;inset:0;will-change:transform}
.layer>*{position:absolute}
#L1{z-index:1}#L2{z-index:2}#L3{z-index:3}#L4{z-index:4}

/* The "box" is a fixed 3:4 design canvas centred inside the stage so the
   artwork keeps its proportions in 3:4, 9:16 and 16:9. */
.box{
  position:absolute!important;left:50%;top:50%;
  width:min(100cqw,75cqh);aspect-ratio:3/4;transform:translate(-50%,-50%);
  container-type:size;
}
.box>*{position:absolute}

/* ---------- Layer 1: background ---------- */
#paperBg{inset:0;background:var(--paper)}
#gridSvg{inset:0;width:100%;height:100%}
#grain{inset:0;width:100%;height:100%;z-index:9;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
.dots{--dot:var(--red);--sz:2.1cqw;
  background-image:radial-gradient(circle at center,var(--dot) 32%,transparent 36%);
  background-size:var(--sz) var(--sz)}
#htRed{left:19%;top:41%;width:36%;aspect-ratio:1;border-radius:50%;
  -webkit-mask-image:radial-gradient(circle at 25% 75%,#000 35%,transparent 72%);
  mask-image:radial-gradient(circle at 25% 75%,#000 35%,transparent 72%)}
#htDark1{--dot:var(--ink);--sz:1.8cqw;left:66%;top:9%;width:33%;height:15%;
  -webkit-mask-image:linear-gradient(100deg,transparent 0%,#000 60%);mask-image:linear-gradient(100deg,transparent 0%,#000 60%)}
#htDark2{--dot:#27414f;--sz:1.7cqw;left:62%;top:28%;width:30%;height:17%;
  -webkit-mask-image:linear-gradient(160deg,#000 20%,transparent 80%);mask-image:linear-gradient(160deg,#000 20%,transparent 80%)}
#gridPatch{left:66%;top:6%;width:34%;height:32%;opacity:.0}

/* ---------- Layer 2: mid-back ---------- */
#darkBand{left:-2%;top:64%;width:104%;height:30%;background:var(--ink)}
#darkRight{left:78%;top:40%;width:24%;height:30%;background:#222}
#darkBand::after,#darkRight::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:3.2cqw 3.2cqw}
#arrow{left:18%;top:17%;width:80%;overflow:visible}
#arrow svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- Layer 3: subject ---------- */
#subjWrap{left:1%;top:6%;width:98%}
#subjectImg{display:block;width:100%;height:auto;
  filter:drop-shadow(0 .8cqw 1.2cqw rgba(0,0,0,.35));user-select:none;-webkit-user-drag:none}

/* ---------- Layer 4: foreground ---------- */
#pathSvg{left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.badge{width:12.5%;aspect-ratio:1;border-radius:50%;background:var(--ink);
  border:1.1cqw solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--head-font);color:#fff;transform:translate(-50%,-50%);
  box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.35)}
.badge b{font-size:4.3cqw;font-weight:700;line-height:1}
.badge span{font-size:2.1cqw;font-weight:500;line-height:1.1;opacity:.9}
.pin{width:11%;aspect-ratio:1;border-radius:50%;background:var(--ink);border:1.1cqw solid var(--gold);
  display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.pin svg{width:46%;height:46%}

/* free items positioned on the whole stage (per-ratio layout) */
.free{position:absolute;container-type:inline-size}
#headline{font-family:var(--head-font);color:var(--ink);text-transform:uppercase;line-height:.95}
#headline .row1{display:flex;align-items:center;gap:3cqw}
#headline .big{font-size:18cqw;font-weight:700;white-space:nowrap;display:block;overflow:hidden}
#headline .big>span{display:block}
#headline .small{display:flex;flex-direction:column;font-size:7.4cqw;font-weight:500;line-height:1.02;letter-spacing:.04em;overflow:hidden}
#headline .small i{display:block;font-style:normal}
#headline .big2{font-size:17.2cqw}
#headline .bar{display:flex;align-items:flex-end;margin-top:2cqw;height:1.6cqw}
#headline .bar b{display:block;width:30%;height:100%;background:var(--ink);transform-origin:left}
#headline .bar u{display:block;flex:1;height:.55cqw;background:var(--ink);transform-origin:left;margin-left:2cqw}
#headline .bar.red b{background:var(--red)}

#banner{filter:drop-shadow(0 .7cqw 1cqw rgba(0,0,0,.35))}
#bannerPaper{background:#efe6d2;padding:6cqw 4cqw 3.5cqw;text-align:center}
#bannerPaper .txt{font-family:var(--serif-font);font-weight:900;font-size:15cqw;line-height:1;color:var(--ink);overflow:hidden;white-space:nowrap}
#bannerPaper .txt span{display:block}
#bannerPaper .ul{height:1.2cqw;background:var(--ink);margin-top:2.4cqw;transform-origin:left}
#stampWrap{filter:drop-shadow(.6cqw 1cqw 1cqw rgba(0,0,0,.45))}
#stamp{background:var(--red);color:#f6ecd8;text-align:center;font-family:var(--serif-font);font-weight:900;
  padding:7cqw 8cqw;line-height:.95;
  clip-path:polygon(7% 0,93% 0,100% 12%,100% 88%,93% 100%,7% 100%,0 88%,0 12%);position:relative}
#stamp::before{content:"";position:absolute;inset:3cqw;border:1cqw solid #f6ecd8;border-radius:2cqw;
  clip-path:polygon(7% 0,93% 0,100% 12%,100% 88%,93% 100%,7% 100%,0 88%,0 12%)}
#stamp .a{font-size:21cqw;display:block;letter-spacing:.02em}
#stamp .b{font-size:13cqw;display:block;letter-spacing:.03em}

/* Arabic mode (set CONFIG.arabic = true) */
body.ar #headline,body.ar .badge,body.ar #bannerPaper .txt,body.ar #stamp{font-family:'Tajawal','Amiri',sans-serif;font-weight:800}
body.ar #headline{direction:rtl}

/* ---------- Control bar ---------- */
#controls{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  padding:10px 14px 14px;background:#151515;border-top:1px solid #262626}
#controls button,#controls label.btn{
  background:#222;border:1px solid #3a3a3a;color:#eee;padding:8px 14px;border-radius:8px;cursor:pointer;
  font:600 13px/1 system-ui,sans-serif;user-select:none}
#controls button:hover,#controls label.btn:hover{background:#2e2e2e}
#controls button.active{background:var(--red);border-color:var(--red);color:#fff}
#scrub{flex:1 1 220px;min-width:140px;max-width:520px;accent-color:var(--red)}
.group{display:flex;gap:4px}
#timeLbl{font:12px/1 ui-monospace,monospace;color:#999;min-width:74px;text-align:center}
</style>
</head>
<body>

<div id="stageWrap">
  <div id="stage" data-ratio="3:4">

    <!-- ============ LAYER 1 : BACKGROUND (z 1) ============ -->
    <div class="layer" id="L1">
      <div id="paperBg"></div>
      <svg id="gridSvg" preserveAspectRatio="none">
        <defs>
          <pattern id="gridPat" width="38" height="38" patternUnits="userSpaceOnUse">
            <path d="M38 0H0V38" fill="none" stroke="#1a1a1a" stroke-opacity=".16" stroke-width="1"/>
          </pattern>
          <pattern id="gridPatBig" width="190" height="190" patternUnits="userSpaceOnUse">
            <path d="M190 0H0V190" fill="none" stroke="#1a1a1a" stroke-opacity=".12" stroke-width="2"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#gridPat)"/>
        <rect width="100%" height="100%" fill="url(#gridPatBig)"/>
      </svg>
      <div class="box" id="boxBack">
        <div class="dots" id="htRed"></div>
        <div class="dots" id="htDark1"></div>
        <div class="dots" id="htDark2"></div>
      </div>
    </div>

    <!-- ============ LAYER 2 : MID-BACK (z 2) ============ -->
    <div class="layer" id="L2">
      <div class="box" id="boxMid">
        <div id="darkBand" data-torn="top"></div>
        <div id="darkRight" data-torn="left"></div>
        <div id="arrow">
          <svg viewBox="0 0 800 150">
            <polygon id="arrowShape" fill="#d62828"
              points="0,30 560,30 560,0 800,75 560,150 560,120 0,120"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ============ LAYER 3 : SUBJECT (z 3) ============ -->
    <div class="layer" id="L3">
      <div class="box" id="boxSubj">
        <div id="subjWrap"><img id="subjectImg" src="subject.png" alt="subject" draggable="false"></div>
      </div>
    </div>

    <!-- ============ LAYER 4 : FOREGROUND (z 4) ============ -->
    <div class="layer" id="L4">
      <div class="box" id="boxFront">
        <svg id="pathSvg" viewBox="0 0 1000 1333.333" preserveAspectRatio="none"></svg>
        <div class="badge" id="b267"><b>267</b><span>facts</span></div>
        <div class="badge" id="b150"><b>150</b><span>edits</span></div>
        <div class="badge" id="b360"><b>360</b><span>remixes</span></div>
        <div class="pin" id="pinBadge">
          <svg viewBox="0 0 24 24"><path fill="#f4a261" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        </div>
      </div>

      <!-- Free items: text + stamp, repositioned per aspect ratio -->
      <div class="free" id="headline">
        <div class="row1">
          <span class="big"><span data-k="h1">THE MEME</span></span>
          <span class="small"><i data-k="h1s1">THAT</i><i data-k="h1s2">DEFINES</i></span>
        </div>
        <span class="big big2" style="display:block;overflow:hidden"><span data-k="h2" style="display:block">RECOGNITION</span></span>
        <div class="bar"><b></b><u></u></div>
      </div>

      <div class="free" id="banner">
        <div id="bannerPaper" data-torn="all">
          <div class="txt"><span data-k="banner">POINTING</span></div>
          <div class="ul"></div>
        </div>
      </div>

      <div class="free" id="stampWrap">
        <div id="stamp"><span class="a" data-k="stamp1">VOX</span><span class="b" data-k="stamp2">ANALYSIS</span></div>
      </div>
    </div>

    <!-- paper grain over everything -->
    <svg id="grain" style="position:absolute;z-index:9">
      <filter id="grainF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
        <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .35 -.05"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainF)"/>
    </svg>
  </div>
</div>

<!-- ============ CONTROL BAR ============ -->
<div id="controls">
  <button id="btnPlay">⏸ Pause</button>
  <button id="btnReplay">↺ Replay</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
  <span id="timeLbl">0.0 / 0.0s</span>
  <div class="group" id="ratioGroup">
    <button data-r="3:4" class="active">3:4</button>
    <button data-r="9:16">9:16</button>
    <button data-r="16:9">16:9</button>
  </div>
  <label class="btn" for="fileIn">⬆ Upload Image</label>
  <input id="fileIn" type="file" accept="image/*" hidden>
  <button id="btnMute">🔇 Sound off</button>
</div>

<script>
/* =====================================================================
   CONFIG — edit texts, labels and timing here
   ===================================================================== */
const CONFIG = {
  arabic: false,                                   // true = use the Arabic texts below
  en: { h1:"THE MEME", h1s1:"THAT", h1s2:"DEFINES", h2:"RECOGNITION",
        banner:"POINTING", stamp1:"VOX", stamp2:"ANALYSIS",
        b267:["267","facts"], b150:["150","edits"], b360:["360","remixes"] },
  ar: { h1:"الميم", h1s1:"الذي", h1s2:"يصنع", h2:"الاعتراف",
        banner:"يشير", stamp1:"VOX", stamp2:"تحليل",
        b267:["267","حقيقة"], b150:["150","تعديل"], b360:["360","نسخة"] },
  wiggleStep: 0.25,          // seconds between stop-motion frames (0.25 = 4fps look)
  parallax: { L1:5, L2:10, L3:16, L4:26 },   // max px shift per layer on mouse move
  tilt: 3                    // max 3D tilt in degrees on mouse move
};

/* Per-ratio positions of the free items: [left%, top%, width%] of the stage */
const LAYOUT = {
  "3:4":  { ratio:3/4,   headline:[5,4,38],   banner:[50,87,48], stamp:[55,76,26] },
  "9:16": { ratio:9/16,  headline:[6,3,46],   banner:[8,90,84],  stamp:[60,80,30] },
  "16:9": { ratio:16/9,  headline:[3,8,27],   banner:[69,76,28], stamp:[72,54,15] }
};

/* Dashed connector paths — coordinates are fractions of the 3:4 design box */
const PATHS = [
  { id:"p1", color:"#d62828", head:true,  d:"M .17 .205 C .03 .19 .02 .29 .068 .318" },
  { id:"p2", color:"#f4a261", head:false, d:"M .105 .47 C .095 .52 .10 .55 .118 .575" },
  { id:"p3", color:"#f4a261", head:false, d:"M .14 .64 C .16 .72 .19 .78 .215 .815" },
  { id:"p4", color:"#f4a261", head:true,  d:"M .255 .85 C .31 .885 .40 .915 .475 .925" },
  { id:"p5", color:"#f4a261", head:false, d:"M .255 .83 C .45 .88 .72 .84 .74 .665" },
  { id:"p6", color:"#f4a261", head:false, d:"M .775 .57 C .95 .55 .96 .40 .90 .28" },
  { id:"p7", color:"#f4a261", head:false, d:"M .815 .08 C .78 .03 .72 .06 .70 .13" }
];
const BADGES = { b267:[.13,.60], b150:[.22,.85], b360:[.74,.60], pinBadge:[.875,.085] };

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const stage = $("#stage");
let rngSeed = 11;
const rnd = () => (rngSeed = (rngSeed * 16807) % 2147483647) / 2147483647;

/* Torn-paper polygon generator (jagged edges) */
function tornPolygon(mode){
  const pts = [], step = 3.2, j = 1.4;
  const jit = () => (rnd()-.5)*2*j;
  const top = mode==="top"||mode==="all", left = mode==="left"||mode==="all",
        right = mode==="all", bottom = mode==="all";
  for(let x=0;x<=100;x+=step) pts.push([x, top? 1+jit()+j : 0]);
  for(let y=0;y<=100;y+=step) pts.push([right? 99+jit()-j : 100, y]);
  for(let x=100;x>=0;x-=step) pts.push([x, bottom? 99+jit()-j : 100]);
  for(let y=100;y>=0;y-=step) pts.push([left? 1+jit()+j : 0, y]);
  return "polygon("+pts.map(p=>p[0].toFixed(1)+"% "+Math.max(0,p[1]).toFixed(1)+"%").join(",")+")";
}
$$("[data-torn]").forEach(el => el.style.clipPath = tornPolygon(el.dataset.torn));

/* Fill texts from CONFIG */
function applyTexts(){
  const t = CONFIG.arabic ? CONFIG.ar : CONFIG.en;
  document.body.classList.toggle("ar", CONFIG.arabic);
  $$("[data-k]").forEach(el => el.textContent = t[el.dataset.k]);
  ["b267","b150","b360"].forEach(id => {
    $("#"+id+" b").textContent = t[id][0]; $("#"+id+" span").textContent = t[id][1];
  });
}
applyTexts();

/* Place badges */
for(const [id,[x,y]] of Object.entries(BADGES)){
  const el = document.getElementById(id);
  el.style.left = x*100+"%"; el.style.top = y*100+"%";
}

/* Build dashed paths: a dashed stroke revealed through a mask whose solid
   stroke is "drawn" with strokeDashoffset. */
const svgNS = "http://www.w3.org/2000/svg";
const pathSvg = $("#pathSvg");
const W = 1000, H = 1333.333;
const scalePath = d => d.replace(/(-?\d*\.?\d+)\s+(-?\d*\.?\d+)/g,(m,a,b)=>(a*W).toFixed(1)+" "+(b*H).toFixed(1));
const defs = document.createElementNS(svgNS,"defs"); pathSvg.appendChild(defs);
PATHS.forEach(p => {
  const d = scalePath(p.d);
  const mask = document.createElementNS(svgNS,"mask");
  mask.setAttribute("id","m_"+p.id); mask.setAttribute("maskUnits","userSpaceOnUse");
  mask.setAttribute("x",-100); mask.setAttribute("y",-100); mask.setAttribute("width",1200); mask.setAttribute("height",1500);
  const mp = document.createElementNS(svgNS,"path");
  mp.setAttribute("d",d); mp.setAttribute("fill","none"); mp.setAttribute("stroke","#fff");
  mp.setAttribute("stroke-width",22); mp.setAttribute("pathLength",1);
  mp.setAttribute("stroke-dasharray",1); mp.setAttribute("stroke-dashoffset",1);
  mp.classList.add("maskPath"); mp.dataset.id = p.id;
  mask.appendChild(mp); defs.appendChild(mask);

  const vis = document.createElementNS(svgNS,"path");
  vis.setAttribute("d",d); vis.setAttribute("fill","none"); vis.setAttribute("stroke",p.color);
  vis.setAttribute("stroke-width",5); vis.setAttribute("stroke-linecap","round");
  vis.setAttribute("stroke-dasharray","11 12"); vis.setAttribute("mask","url(#m_"+p.id+")");
  pathSvg.appendChild(vis);

  if(p.head){
    const L = vis.getTotalLength();
    const a = vis.getPointAtLength(L), b = vis.getPointAtLength(L-4);
    const ang = Math.atan2(a.y-b.y, a.x-b.x)*180/Math.PI;
    const g = document.createElementNS(svgNS,"g");
    g.setAttribute("transform",`translate(${a.x} ${a.y}) rotate(${ang})`);
    const tri = document.createElementNS(svgNS,"polygon");
    tri.setAttribute("points","10,0 -14,-13 -14,13"); tri.setAttribute("fill",p.color);
    tri.classList.add("headTri"); tri.dataset.id = p.id;
    g.appendChild(tri); pathSvg.appendChild(g);
  }
});

/* =====================================================================
   AUDIO (Web Audio, synthesised — no files)
   ===================================================================== */
let actx = null, muted = true, playing = true, scrubbing = false;
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==="suspended") actx.resume();
  return actx;
}
function noiseBuf(ctx,dur){
  const b = ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function sfx(kind){
  if(muted||!playing||scrubbing) return;
  const ctx = ac(); if(!ctx) return;
  const t = ctx.currentTime, g = ctx.createGain(); g.connect(ctx.destination);
  if(kind==="whoosh"){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf(ctx,.6);
    const f = ctx.createBiquadFilter(); f.type="bandpass"; f.Q.value=.9;
    f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(3200,t+.35);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.12); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    s.connect(f).connect(g); s.start(t); s.stop(t+.6);
  } else if(kind==="pop"){
    const o = ctx.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(140,t+.14);
    g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g); o.start(t); o.stop(t+.2);
  } else if(kind==="slap"){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf(ctx,.2);
    const f = ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1400;
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    s.connect(f).connect(g); s.start(t); s.stop(t+.2);
    const o = ctx.createOscillator(), g2 = ctx.createGain(); o.type="sine";
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.2);
    g2.gain.setValueAtTime(.55,t); g2.gain.exponentialRampToValueAtTime(.0001,t+.25);
    o.connect(g2).connect(ctx.destination); o.start(t); o.stop(t+.3);
  }
}

/* =====================================================================
   MASTER TIMELINE
   ===================================================================== */
const master = gsap.timeline({ paused:true, defaults:{ ease:"power3.out" } });

function buildTimeline(){
  /* --- Layer 1 : background --- */
  master.fromTo("#gridSvg,#paperBg",{opacity:0},{opacity:1,duration:.8,ease:"none"},0)
        .fromTo("#grain",{opacity:0},{opacity:.55,duration:1,ease:"none"},0)
        .fromTo(["#htRed","#htDark1","#htDark2"],{scale:0,opacity:0,transformOrigin:"50% 50%"},
                {scale:1,opacity:1,duration:.7,ease:"back.out(1.6)",stagger:.18},.25)
        .call(()=>sfx("pop"),null,.3).call(()=>sfx("pop"),null,.48).call(()=>sfx("pop"),null,.66);

  /* --- Layer 2 : dark blocks + red arrow --- */
  master.fromTo("#darkBand",{yPercent:60,opacity:0},{yPercent:0,opacity:1,duration:.7},.7)
        .fromTo("#darkRight",{xPercent:80,opacity:0},{xPercent:0,opacity:1,duration:.7},.8)
        .call(()=>sfx("whoosh"),null,.95)
        .fromTo("#arrow",{clipPath:"inset(-5% 100% -5% 0%)",xPercent:-6},
                {clipPath:"inset(-5% -4% -5% 0%)",xPercent:0,duration:.85,ease:"back.out(1.3)"},1);

  /* --- Layer 3 : subject paper-cutout pop --- */
  master.call(()=>sfx("whoosh"),null,1.55)
        .fromTo("#subjectImg",{yPercent:22,rotation:-5,opacity:0,transformOrigin:"50% 100%"},
                {yPercent:0,rotation:0,opacity:1,duration:.95,ease:"back.out(1.4)"},1.6)
        .call(()=>sfx("pop"),null,1.95);

  /* --- Layer 4 : headline --- */
  master.fromTo("#headline .big>span, #headline .small i",{yPercent:110},
                {yPercent:0,duration:.6,stagger:.1,ease:"power4.out"},2.25)
        .fromTo("#headline .bar b",{scaleX:0},{scaleX:1,duration:.5,ease:"power2.out"},2.7)
        .fromTo("#headline .bar u",{scaleX:0},{scaleX:1,duration:.7,ease:"power2.out"},2.85);

  /* --- connector paths drawing themselves --- */
  const order = ["p1","p2","p3","p5","p6","p7","p4"];
  order.forEach((id,i)=>{
    const at = 3.0 + i*.22;
    master.fromTo(`.maskPath[data-id="${id}"]`,{attr:{"stroke-dashoffset":1}},
                  {attr:{"stroke-dashoffset":0},duration:.8,ease:"power1.inOut"},at);
    const head = $(`.headTri[data-id="${id}"]`);
    if(head) master.fromTo(head,{scale:0,transformOrigin:"0 0",opacity:0},
                  {scale:1,opacity:1,duration:.25,ease:"back.out(2.4)",transformBox:"fill-box"},at+.7);
  });

  /* --- circular badges (spring) --- */
  ["#b267","#b150","#b360","#pinBadge"].forEach((s,i)=>{
    master.fromTo(s,{scale:0,opacity:0},{scale:1,opacity:1,duration:.55,ease:"back.out(1.7)"},3.3+i*.28)
          .call(()=>sfx("pop"),null,3.3+i*.28+.05);
  });

  /* --- bottom-right banner + stamp --- */
  master.call(()=>sfx("whoosh"),null,4.35)
        .fromTo("#banner",{clipPath:"inset(0 100% 0 0)",xPercent:-4},
                {clipPath:"inset(-10% -10% -10% -10%)",xPercent:0,duration:.7},4.4)
        .fromTo("#bannerPaper .txt span",{yPercent:110},{yPercent:0,duration:.55,ease:"power4.out"},4.7)
        .fromTo("#bannerPaper .ul",{scaleX:0},{scaleX:1,duration:.55,ease:"power2.out"},5.0)
        .fromTo("#stampWrap",{scale:2.6,opacity:0,rotation:-18,transformOrigin:"50% 50%"},
                {scale:1,opacity:1,rotation:-6,duration:.28,ease:"power4.in"},5.25)
        .call(()=>sfx("slap"),null,5.52)
        .to("#stampWrap",{scale:1.06,duration:.1,ease:"power1.out"},5.53)
        .to("#stampWrap",{scale:1,duration:.35,ease:"elastic.out(1.2,.4)"},5.63)
        .to({}, {duration:.9}, 6.0);           // hold the final frame
}
buildTimeline();

/* --- Continuous stop-motion paper wiggle on the subject (stepped) --- */
const wiggle = gsap.timeline({ repeat:-1 });
for(let i=0;i<8;i++){
  wiggle.set("#subjWrap",{
    rotation:(rnd()-.5)*1.6,                 // ±0.8°
    x:Math.round((rnd()-.5)*4),               // ±2px
    y:Math.round((rnd()-.5)*3),
    transformOrigin:"50% 60%"
  }, i*CONFIG.wiggleStep);
}
wiggle.set({}, {}, 8*CONFIG.wiggleStep);

/* =====================================================================
   PARALLAX (mouse-move 3D depth)
   ===================================================================== */
const layerIds = ["L1","L2","L3","L4"];
const qx = {}, qy = {};
layerIds.forEach(id => {
  qx[id] = gsap.quickTo("#"+id,"x",{duration:.6,ease:"power3.out"});
  qy[id] = gsap.quickTo("#"+id,"y",{duration:.6,ease:"power3.out"});
});
const tiltX = gsap.quickTo(stage,"rotationX",{duration:.8,ease:"power3.out"});
const tiltY = gsap.quickTo(stage,"rotationY",{duration:.8,ease:"power3.out"});
window.addEventListener("pointermove",e=>{
  const nx = (e.clientX/innerWidth - .5)*2, ny = (e.clientY/innerHeight - .5)*2;
  layerIds.forEach(id=>{ qx[id](-nx*CONFIG.parallax[id]); qy[id](-ny*CONFIG.parallax[id]); });
  tiltY(nx*CONFIG.tilt); tiltX(-ny*CONFIG.tilt);
});

/* =====================================================================
   LAYOUT / ASPECT RATIO
   ===================================================================== */
let currentRatio = "3:4";
function fitStage(){
  const wrap = $("#stageWrap"), cs = getComputedStyle(wrap);
  const aw = wrap.clientWidth - parseFloat(cs.paddingLeft)*2, ah = wrap.clientHeight - parseFloat(cs.paddingTop)*2;
  const r = LAYOUT[currentRatio].ratio;
  let w = Math.min(aw, ah*r), h = w/r;
  stage.style.width = w+"px"; stage.style.height = h+"px";
}
function applyLayout(){
  const L = LAYOUT[currentRatio];
  [["headline","#headline"],["banner","#banner"],["stamp","#stampWrap"]].forEach(([k,sel])=>{
    const [l,t,w] = L[k], el = $(sel);
    el.style.left = l+"%"; el.style.top = t+"%"; el.style.width = w+"%";
  });
  /* the 3:4 design box also gets an extra background fill in wide formats via the grid */
  fitStage();
}
$$("#ratioGroup button").forEach(b=>b.addEventListener("click",()=>{
  currentRatio = b.dataset.r;
  $$("#ratioGroup button").forEach(x=>x.classList.toggle("active",x===b));
  stage.dataset.ratio = currentRatio;
  applyLayout();
}));
addEventListener("resize",fitStage);
applyLayout();

/* =====================================================================
   CONTROLS
   ===================================================================== */
const btnPlay = $("#btnPlay"), scrub = $("#scrub"), timeLbl = $("#timeLbl");
function setPlaying(p){
  playing = p;
  if(p){ if(master.progress()>=1) master.restart(); else master.play(); wiggle.play(); }
  else { master.pause(); wiggle.pause(); }
  btnPlay.textContent = p ? "⏸ Pause" : "▶ Play";
}
btnPlay.onclick = () => { ac(); setPlaying(!playing); };
$("#btnReplay").onclick = () => { ac(); master.restart(); wiggle.play(); setPlaying(true); };

master.eventCallback("onUpdate",()=>{
  if(!scrubbing) scrub.value = master.progress()*1000;
  timeLbl.textContent = master.time().toFixed(1)+" / "+master.duration().toFixed(1)+"s";
});
master.eventCallback("onComplete",()=>{ btnPlay.textContent="▶ Play"; playing=false; });

scrub.addEventListener("pointerdown",()=>{ scrubbing=true; });
scrub.addEventListener("input",()=>{
  scrubbing = true; master.pause(); wiggle.pause();
  master.progress(scrub.value/1000);
  btnPlay.textContent="▶ Play"; playing=false;
});
addEventListener("pointerup",()=>{ scrubbing=false; });

$("#btnMute").onclick = e => {
  muted = !muted; if(!muted) ac();
  e.currentTarget.textContent = muted ? "🔇 Sound off" : "🔊 Sound on";
};

/* Upload Image: load a local file straight into the scene */
$("#fileIn").addEventListener("change",e=>{
  const f = e.target.files[0]; if(!f) return;
  const url = URL.createObjectURL(f);
  $("#subjectImg").src = url;
});

/* Autoplay once everything (fonts + image) is ready */
const subjImg = $("#subjectImg");
const ready = Promise.all([
  (document.fonts && document.fonts.ready) || Promise.resolve(),
  new Promise(r => subjImg.complete ? r() : (subjImg.onload = subjImg.onerror = r))
]);
ready.then(()=>{ fitStage(); master.restart(); });
/* Safety net if fonts hang */
setTimeout(()=>{ if(master.time()===0 && !master.isActive()) master.play(); },2500);
</script>
</body>
