<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="play">▶ CLICK TO PLAY</div>
<script>
// =====================================================================
//  DIDDY: POWER, INFLUENCE, RECKONING  — deterministic frame renderer
//  renderFrame(t) draws the frame at time t (seconds). Same t = same image.
//  Open index.html?preview (via a local web server) to watch with audio.
// =====================================================================
const W=1920,H=1080, DURATION=98;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const GOLD='#d6a84f', CREAM='#f1e7d0', BLUE='#8fb3d9', RED='#d23c3c', INK='#0b0b0d';

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x, eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)}

// ---------- assets ----------
const IMG={}, files={
 dark:'assets/photos/dark_portrait.jpg', mic:'assets/photos/perform_mic.jpg', denim:'assets/photos/perform_denim.jpg',
 sj:'assets/photos/seanjohn.jpg', young:'assets/photos/young_glasses.jpg', shades:'assets/photos/sunglasses.jpg',
 bb:'assets/photos/badboy_building.jpg', star:'assets/photos/walk_of_fame.jpg', suit:'assets/photos/white_suit.jpg',
 year:'assets/photos/yearbook.jpg', harlem:'assets/cc/harlem2.jpg', apollo:'assets/cc/apollo.jpg', court:'assets/cc/courthouse.jpg'};
let ENV=[];
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});

// ---------- drawing helpers ----------
function cover(img,{x=0,y=0,w=W,h=H,zoom=1,fx=.5,fy=.5,alpha=1,filter='none'}={}){
  const s=Math.max(w/img.width,h/img.height)*zoom, dw=img.width*s, dh=img.height*s;
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.globalAlpha*=alpha; ctx.filter=filter;
  ctx.drawImage(img,x+(w-dw)*fx,y+(h-dh)*fy,dw,dh); ctx.restore();
}
function print(img,{cx,cy,w,h,rot=0,alpha=1,zoom=1,fx=.5,fy=.5,filter='none',border=14,caption=null,capColor='#222'}){
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(cx,cy); ctx.rotate(rot);
  const cap=caption?56:0;
  ctx.shadowColor='rgba(0,0,0,.65)'; ctx.shadowBlur=50; ctx.shadowOffsetY=22;
  ctx.fillStyle='#ece5d6'; ctx.fillRect(-w/2-border,-h/2-border,w+2*border,h+2*border+cap);
  ctx.shadowColor='transparent';
  cover(img,{x:-w/2,y:-h/2,w,h,zoom,fx,fy,filter});
  if(caption) text(caption,0,h/2+border+cap/2-2,{font:'italic 30px Playfair',color:capColor});
  ctx.restore();
}
function text(s,x,y,{font='64px Bebas',color='#fff',alpha=1,align='center',ls=0,base='middle',shadow=0,stroke=null}={}){
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=font; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline=base;
  ctx.letterSpacing=ls+'px';
  if(shadow){ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=shadow}
  if(stroke){ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.w;ctx.strokeText(s,x,y)}
  ctx.fillText(s,x,y); ctx.restore();
}
// text that tracks in (letter-spacing tightens, fades and un-blurs)
function trackIn(s,x,y,t,a,opts={},dur=1.2,from=60,to=null){
  const k=eOut(p(t,a,a+dur)); if(k<=0) return;
  const ls=lerp(from,to??(opts.ls||0),k);
  text(s,x,y,{...opts,ls,alpha:(opts.alpha??1)*k});
}
// text revealed by a wipe mask from bottom (rises up)
function rise(s,x,y,t,a,opts={},dur=.6,size=100){
  const k=eOut(p(t,a,a+dur)); if(k<=0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0,y-size*0.75,W,size*1.5); ctx.clip();
  text(s,x,y+(1-k)*size,{...opts,alpha:(opts.alpha??1)*Math.min(1,k*1.5)}); ctx.restore();
}
function rowX(words,font,ls,gap){ctx.save();ctx.font=font;ctx.letterSpacing=ls+'px';const ws=words.map(w=>ctx.measureText(w).width);ctx.restore();const tot=ws.reduce((a,b)=>a+b,0)+gap*(words.length-1);let x=W/2-tot/2;return ws.map(w=>{const c=x+w/2;x+=w+gap;return c})}
function lowerThird(title,sub,t,a,b,accent=GOLD){
  const k=eOut(p(t,a,a+.7)), o=1-p(t,b-.5,b); const al=Math.min(k,o); if(al<=0) return;
  const x=110,y=930;
  ctx.save(); ctx.globalAlpha*=al;
  const g=ctx.createLinearGradient(x,0,x+900,0); g.addColorStop(0,'rgba(0,0,0,.65)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(x-20,y-58,900,116);
  ctx.fillStyle=accent; ctx.fillRect(x,y-44,6,88*k);
  text(title,x+30+(1-k)*30,y-14,{font:'700 34px Inter',align:'left',ls:5});
  text(sub,x+30+(1-k)*50,y+26,{font:'400 24px Inter',color:'rgba(255,255,255,.72)',align:'left',ls:2});
  ctx.restore();
}
function credit(s,t,a,b){const al=Math.min(p(t,a,a+.5),1-p(t,b-.4,b)); text(s,W-40,H-34,{font:'400 18px Inter',color:'rgba(255,255,255,.55)',align:'right',alpha:al,ls:1})}

// polyline stroking with draw-on progress
const LEN=new WeakMap();
function strokeLines(lines,prog,{color=CREAM,width=3,alpha=1,glow=0,cap='round'}={}){
  if(prog<=0||alpha<=0) return;
  let meta=LEN.get(lines);
  if(!meta){let tot=0;const ls=lines.map(l=>{let s=0;for(let i=2;i<l.length;i+=2)s+=Math.hypot(l[i]-l[i-2],l[i+1]-l[i-1]);tot+=s;return s});meta={ls,tot};LEN.set(lines,meta)}
  let budget=meta.tot*clamp(prog);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap=cap; ctx.lineJoin='round';
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow}
  ctx.beginPath();
  for(let li=0;li<lines.length&&budget>0;li++){
    const l=lines[li]; ctx.moveTo(l[0],l[1]);
    for(let i=2;i<l.length;i+=2){
      const sl=Math.hypot(l[i]-l[i-2],l[i+1]-l[i-1]);
      if(budget>=sl){ctx.lineTo(l[i],l[i+1]);budget-=sl}
      else{const f=budget/sl;ctx.lineTo(lerp(l[i-2],l[i],f),lerp(l[i-1],l[i+1],f));budget=0;break}
    }
  }
  ctx.stroke(); ctx.restore();
}
const circ=(cx,cy,r,n=64,a0=0,a1=Math.PI*2)=>{const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}return o};
const rect=(x,y,w,h)=>[x,y,x+w,y,x+w,y+h,x,y+h,x,y];

// ---------- grain, vignette ----------
const GRAIN=[];
function makeGrain(){for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d');const d=g.createImageData(960,540);const r=rng(99+k);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);GRAIN.push(c)}}
function grain(t,amt=.07){const f=Math.floor(t*24)%GRAIN.length;ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=amt;ctx.drawImage(GRAIN[f],0,0,W,H);ctx.restore()}
function vignette(str=.75){const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${str})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function tint(color,alpha,mode='soft-light'){ctx.save();ctx.globalCompositeOperation=mode;ctx.globalAlpha*=alpha;ctx.fillStyle=color;ctx.fillRect(0,0,W,H);ctx.restore()}
function flash(t,times,dur=.18){let v=0;for(const s of times){if(t>=s&&t<s+dur)v=Math.max(v,1-(t-s)/dur)}if(v>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha*=v*.85;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore()}}
function env(t){const i=Math.floor(t*30);return ENV[i]||0}

// ---------- 2D ILLUSTRATIONS (procedural line art) ----------
let HARLEM, SKY, STUDIO_MIC, COURT, PARTICLES, CROWD, HANGER, CRACK, CHART;
function buildIllustrations(){
  // --- Harlem brownstone row + skyline ---
  const r=rng(7), L=[], wins=[]; let x=40; const base=940;
  while(x<1880){
    const w=190+Math.floor(r()*70), h=420+Math.floor(r()*190), top=base-h;
    L.push([x,base,x,top,x+w,top,x+w,base]);
    L.push([x-12,top,x+w+12,top]); L.push([x-12,top+20,x+w+12,top+20]);
    for(let bx=x+8;bx<x+w;bx+=26) L.push([bx,top+20,bx,top+34]);
    const floors=Math.floor((h-210)/92);
    for(let f=0;f<floors;f++){const wy=top+62+f*92;for(let c=0;c<3;c++){const ww=(w-44)/3-14,wx=x+22+c*(w-44)/3+7;L.push(rect(wx,wy,ww,58));L.push([wx-5,wy-7,wx+ww+5,wy-7]);L.push([wx+ww/2,wy,wx+ww/2,wy+58]);wins.push([wx,wy,ww,58,r()])}}
    // stoop + door
    const dx=x+w*.58, dy=base-96; L.push(rect(dx,dy-110,54,110)); L.push(circ(dx+27,dy-110,27,16,Math.PI,Math.PI*2));
    const st=[];for(let s=0;s<7;s++){st.push(dx-s*16,dy+s*14,dx-s*16,dy+(s+1)*14)}L.push(st);
    L.push([dx+60,dy-30,dx-112,base-40]); L.push([dx+60,dy-30,dx+60,dy]);
    if(r()>.55){const tx=x+w*.25,ty=top;L.push(rect(tx,ty-90,56,60));L.push([tx-4,ty-90,tx+28,ty-122,tx+60,ty-90]);L.push([tx+6,ty-30,tx,ty]);L.push([tx+50,ty-30,tx+56,ty]);}
    x+=w+6;
  }
  L.push([0,base,W,base]);
  L.sort((a,b)=>Math.min(...a.filter((_,i)=>i%2==0))-Math.min(...b.filter((_,i)=>i%2==0)));
  HARLEM={lines:L,wins};
  const S=[],r2=rng(3);let sx=0;while(sx<W){const w=40+r2()*110,h=120+r2()*420;S.push(rect(sx,520-h+200,w,h+200));if(r2()>.7)S.push([sx+w/2,320-h+200,sx+w/2,260-h+200]);sx+=w+r2()*20}
  SKY=S;

  // --- studio microphone (right side) ---
  const M=[], cx=1440, cy=430;
  // capsule body (pill)
  const pill=[];const pr=95,ph=170;for(let i=0;i<=32;i++){const a=Math.PI+i/32*Math.PI;pill.push(cx+Math.cos(a)*pr,cy-ph/2+Math.sin(a)*pr)}for(let i=0;i<=32;i++){const a=i/32*Math.PI;pill.push(cx+Math.cos(a)*pr,cy+ph/2+Math.sin(a)*pr)}pill.push(pill[0],pill[1]);M.push(pill);
  for(let gy=cy-ph/2-60;gy<=cy+20;gy+=18){const half=Math.sqrt(Math.max(0,pr*pr-Math.max(0,(cy-ph/2)-gy)**2))-6;M.push([cx-half,gy,cx+half,gy])}
  M.push([cx-pr,cy+30,cx+pr,cy+30]);M.push([cx-pr,cy+42,cx+pr,cy+42]);
  M.push(circ(cx,cy+60,160,64,0.15*Math.PI,0.85*Math.PI));M.push(circ(cx,cy+60,175,64,0.15*Math.PI,0.85*Math.PI));
  M.push([cx,cy+235,cx,cy+330]);M.push([cx-30,cy+330,cx+30,cy+330]);M.push([cx,cy+330,cx,1080]);
  M.push(circ(cx-260,cy-10,120,64));M.push(circ(cx-260,cy-10,112,64));
  for(let k=-5;k<=5;k++){M.push([cx-260+k*20,cy-10-Math.sqrt(112*112-(k*20)**2),cx-260+k*20,cy-10+Math.sqrt(112*112-(k*20)**2)])}
  M.push([cx-260,cy+110,cx-200,cy+200,cx-60,cy+260]);
  STUDIO_MIC=M;

  // --- courtroom ---
  const C=[];
  C.push(rect(520,560,880,280)); C.push([490,560,1430,560]); C.push([490,545,1430,545,1430,560]); C.push([490,545,490,560]);
  for(let i=0;i<5;i++){C.push(rect(545+i*172,590,150,220))}
  C.push(rect(880,330,160,215)); C.push(circ(960,250,78,72)); C.push(circ(960,250,64,72));
  { const st=[];for(let i=0;i<=10;i++){const a=-Math.PI/2+i*Math.PI*2/5*2/2*1;}
    const star=[];for(let i=0;i<=10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?14:34;star.push(960+Math.cos(a)*rr,250+Math.sin(a)*rr)}C.push(star);}
  for(const fx of [380,1540]){C.push([fx,840,fx,300]);C.push(circ(fx,292,8,16));const cl=[];for(let i=0;i<=20;i++){cl.push(fx+(fx<960?1:-1)*i*7,310+Math.sin(i*.6)*10)}C.push(cl);const cl2=[];for(let i=0;i<=20;i++){cl2.push(fx+(fx<960?1:-1)*i*7,430+Math.sin(i*.6)*10)}C.push(cl2);C.push([cl[cl.length-2],cl[cl.length-1],cl2[cl2.length-2],cl2[cl2.length-1]])}
  C.push(rect(90,700,330,180)); for(let i=0;i<6;i++){C.push(circ(130+i*52,672,18,20));C.push(circ(130+i*52,712,30,20,Math.PI,Math.PI*2))}
  C.push(rect(1500,700,330,180)); for(let i=0;i<6;i++){C.push(circ(1540+i*52,672,18,20));C.push(circ(1540+i*52,712,30,20,Math.PI,Math.PI*2))}
  C.push([0,880,W,880]);
  COURT=C;

  // --- hanger + tracksuit jacket ---
  const J=[],hx=1380,hy=250;
  J.push([hx,hy-60,hx,hy-90,hx+20,hy-110,hx+40,hy-90]); J.push([hx,hy-60,hx-230,hy+20,hx+230,hy+20,hx,hy-60]);
  J.push([hx-70,hy-20,hx-240,hy+40,hx-310,hy+420,hx-240,hy+440,hx-200,hy+170,hx-190,hy+600,hx+190,hy+600,hx+200,hy+170,hx+240,hy+440,hx+310,hy+420,hx+240,hy+40,hx+70,hy-20]);
  J.push([hx-70,hy-20,hx,hy+70,hx+70,hy-20]); J.push([hx,hy+70,hx,hy+600]);
  J.push([hx-190,hy+560,hx+190,hy+560]); J.push([hx-310,hy+390,hx-240,hy+410]); J.push([hx+310,hy+390,hx+240,hy+410]);
  J.push([hx-150,hy+380,hx-70,hy+380]); J.push([hx+70,hy+380,hx+150,hy+380]);
  J.push([hx-240,hy+40,hx-215,hy+40,hx-282,hy+420]); J.push([hx+240,hy+40,hx+215,hy+40,hx+282,hy+420]);
  HANGER=J;

  // --- rising chart ---
  const ch=[];const r3=rng(11);for(let i=0;i<=40;i++){ch.push(120+i*42,960-Math.pow(i/40,1.6)*300-r3()*40)}CHART=[ch];

  // --- crowd silhouettes ---
  CROWD=[];const r4=rng(21);for(let i=0;i<70;i++){CROWD.push({x:r4()*W,y:1010+r4()*100,s:.7+r4()*.6,arm:r4()>.6?(r4()>.5?1:-1):0,ph:r4()*6})}
  CROWD.sort((a,b)=>a.y-b.y);

  // --- particles for BAD BOY ---
  const oc=document.createElement('canvas');oc.width=W;oc.height=500;const og=oc.getContext('2d');
  og.font='360px Bebas';og.textAlign='center';og.textBaseline='middle';og.letterSpacing='18px';og.fillStyle='#fff';og.fillText('BAD BOY',W/2,250);
  const d=og.getImageData(0,0,W,500).data;PARTICLES=[];const r5=rng(5);
  for(let y=0;y<500;y+=7)for(let x=0;x<W;x+=7){if(d[(y*W+x)*4+3]>128)PARTICLES.push({tx:x,ty:y+110,sx:r5()*W,sy:r5()*H*1.4-H*.2,del:r5()*.6,sz:2+r5()*2.5})}

  // --- glass crack geometry (rays x rings) ---
  const cx2=1010,cy2=420,n=15,radii=[0,70,190,360,640,1100,1700];const r6=rng(31);
  const ang=[];for(let i=0;i<n;i++)ang.push(i/n*Math.PI*2+(r6()-.5)*.3);
  const P=ang.map(a=>radii.map((rr,j)=>{const aj=a+(j?(r6()-.5)*.18:0);return [cx2+Math.cos(aj)*rr,cy2+Math.sin(aj)*rr]}));
  const rays=P.map(pts=>pts.flat());
  const rings=[];for(let j=1;j<4;j++){const ring=[];for(let i=0;i<=n;i++){const pt=P[i%n][j];ring.push(pt[0],pt[1])}rings.push(ring)}
  const shards=[];for(let i=0;i<n;i++)for(let j=0;j<radii.length-1;j++){const a=P[i][j],b=P[(i+1)%n][j],c=P[(i+1)%n][j+1],e=P[i][j+1];const mx=(a[0]+b[0]+c[0]+e[0])/4,my=(a[1]+b[1]+c[1]+e[1])/4;shards.push({pts:[a,b,c,e],mx,my,rot:(r6()-.5)*2,sp:.6+r6()*.8})}
  CRACK={rays,rings,shards,cx:cx2,cy:cy2};
}

// ---------- scene helpers ----------
function scene(t,a,b,fn,fade=.5){if(t<a||t>b) return;ctx.save();ctx.globalAlpha=eIO(p(t,a,a+fade));fn(t-a,t);ctx.restore()}
function black(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}

// ================== SCENES ==================
// S1 0–11.5  Opening portrait + names
function S1(lt,t){
  black();
  const spot=eOut(p(t,.2,2.2));
  cover(IMG.dark,{zoom:lerp(1.18,1.04,eOut(p(t,0,11))),fx:.5,fy:.3,alpha:spot,filter:'grayscale(.35) contrast(1.15) brightness(.85)'});
  // spotlight mask
  const g=ctx.createRadialGradient(W*.5,H*.35,50,W*.5,H*.4,lerp(200,1100,spot));g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.92)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // left gradient for type
  const lg=ctx.createLinearGradient(0,0,W*.55,0);lg.addColorStop(0,'rgba(0,0,0,.85)');lg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=lg;ctx.globalAlpha*=p(t,2.6,3.4);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1*eIO(p(t,0,.5));
  // title
  const out=1-p(t,2.6,3.2);
  trackIn('SEAN “DIDDY” COMBS',W/2,H*.82,t,.15,{font:'150px Bebas',color:CREAM,alpha:out,ls:14,shadow:30},1.6,70);
  text('HARLEM-BORN · MUSIC EXECUTIVE · ENTREPRENEUR',W/2,H*.82+92,{font:'500 24px Inter',color:GOLD,ls:8,alpha:out*eOut(p(t,1.0,2.0))});
  // aliases
  const names=[['PUFF DADDY',3.24],['P. DIDDY',4.36],['DIDDY',5.5]];
  names.forEach(([n,s],i)=>{
    const fade=1-p(t,9.6,10.4);
    rise(n,150,330+i*170,t,s,{font:'190px Bebas',align:'left',color:i==2?GOLD:CREAM,alpha:(i<2?lerp(1,.35,p(t,names[i+1][1],names[i+1][1]+.4)):1)*fade,shadow:20},.5,190);

      const ck=eIO(p(t,82.3,86.6));strokeLines(CRACK.rays,ck,{color:'rgba(255,255,255,.85)',width:2.2,glow:6});strokeLines(CRACK.rings,clamp((ck-.3)/.7),{color:'rgba(255,255,255,.6)',width:1.6});
      [['POWER',83.54],['INFLUENCE',84.36],['LEGACY',85.08]].forEach(([w,s],i)=>rise(w,140,360+i*170,t,s,{font:'170px Bebas',align:'left',color:i==2?GOLD:CREAM,ls:8,shadow:30},.4,170));
      ctx.restore();
      if(t<81.9)flash(t,[81.4],.2);
    } else {
      const dt=t-86.9;
      for(const s of CRACK.shards){const dx=(s.mx-CRACK.cx)*s.sp*dt*1.6,dy=(s.my-CRACK.cy)*s.sp*dt*1.6+900*dt*dt;
        ctx.save();ctx.globalAlpha*=clamp(1-dt/1.1);ctx.translate(s.mx+dx,s.my+dy);ctx.rotate(s.rot*dt*2);ctx.translate(-s.mx,-s.my);
        ctx.beginPath();s.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.clip();
        ctx.drawImage(SHARD_IMG,0,0);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
      flash(t,[86.9],.15);
    }
  }
}
let SHARD_IMG=null;
// S10 87.6–93 Title
function S10(lt,t){
  black();
  trackIn('DIDDY',W/2,330,t,87.9,{font:'500 34px Inter',color:'rgba(255,255,255,.7)',ls:30},1.4,60);
  const tx3=rowX(['POWER.','INFLUENCE.','RECKONING.'],'150px Bebas',8,50);[['POWER.',88.1,GOLD],['INFLUENCE.',88.7,GOLD],['RECKONING.',89.4,RED]].forEach(([w,s,c],i)=>rise(w,tx3[i],540,t,s,{font:'150px Bebas',color:c,ls:8,shadow:30},.55,150));
  const r=eOut(p(t,89.8,90.8));ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(W/2-500*r,660,1000*r,1);
  text('A SHORT DOCUMENTARY',W/2,710,{font:'500 22px Inter',color:'rgba(255,255,255,.6)',ls:14,alpha:eOut(p(t,90.2,91))});
}

function S11(lt,t){
  black();
  const k=eOut(p(t,92.8,93.6))*(1-p(t,97.2,98));
  const lines=[['CREDITS','600 30px Inter',GOLD,10],['',null],

// ================== FRAME ==================
function renderFrame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';
  black();
  scene(t,0,11.5,S1,.01);
  scene(t,11.0,19.8,S2);
  scene(t,19.3,24.6,S3);
  scene(t,24.4,28.9,S3b,.2);
  scene(t,28.7,35.7,S4,.25);
  scene(t,35.4,45.4,S5,.3);
  scene(t,45.0,52.3,S6);
  scene(t,52.1,62.9,S7,.15);
  scene(t,62.6,74.9,S8);
  scene(t,74.5,88.0,S9,.4);
  scene(t,87.6,93.0,S10,.4);
  scene(t,92.6,98,S11,.4);
  // global finish
  vignette(.55); grain(t,.075);
  // gentle exposure flicker
  const fl=(hash(Math.floor(t*24))-.5)*.04; if(fl>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=fl;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore()}
  // fade from / to black
  const fb=Math.max(1-p(t,0,.4),p(t,97.3,98));if(fb>0){ctx.fillStyle=`rgba(0,0,0,${fb})`;ctx.fillRect(0,0,W,H)}
}

window.ready=(async()=>{
  const ent=Object.entries(files);const imgs=await Promise.all(ent.map(([k,v])=>loadImg(v)));ent.forEach(([k],i)=>IMG[k]=imgs[i]);

  makeGrain(); buildIllustrations();
  // pre-render the portrait at the moment of shattering, for the shard pieces
  SHARD_IMG=document.createElement('canvas');SHARD_IMG.width=W;SHARD_IMG.height=H;
  { const g=SHARD_IMG.getContext('2d'); ctx.save(); ctx.setTransform(1,0,0,1,0,0); black(); portrait(86.9);
    ctx.save();strokeLines(CRACK.rays,1,{color:'rgba(255,255,255,.85)',width:2.2});ctx.restore(); g.drawImage(cv,0,0); ctx.restore(); }
  renderFrame(0);
  return true;
})();
