<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three Reasons to Run</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    :root {
      --gold: #FFC21A;
      --glow: rgba(255, 176, 0, 0.75);
      --font: "Inter Display", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; overflow: hidden; }
    body { font-family: var(--font); }

    #stage {
      position: absolute; left: 50%; top: 50%;
      width: 1080px; height: 1920px;
      transform-origin: 50% 50%;
      overflow: hidden;
      background: radial-gradient(120% 80% at 50% 45%, #3a2408 0%, #120b04 55%, #050302 100%);
    }
    body.render #stage { left: 0; top: 0; transform: none !important; }

    /* ---------- Full-screen shots (no frames) ---------- */
    .shot { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
    .shot img {
      position: absolute; left: 50%; top: 50%;
      will-change: transform;
    }
    .shot.photo { background: #fff; }
    .shot.photo img { width: 100%; height: 100%; object-fit: cover; left: 0; top: 0; }
    /* cinematic panels: 1400x1920 crop, slightly wider than the screen for a slow pan */
    .shot.panel img { width: 1400px; height: 1920px; left: -160px; top: 0; }
    .shot.collage img { width: 100%; height: 100%; object-fit: cover; left: 0; top: 0; }

    /* readability scrim for captions */
    #scrim {
      position: absolute; left: 0; right: 0; bottom: 0; height: 52%;
      background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.45) 45%, transparent 100%);
      opacity: 0; pointer-events: none;
    }
    #topscrim {
      position: absolute; left: 0; right: 0; top: 0; height: 30%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent);
      opacity: 0;
    }
    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(130% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
    }
    #leak {
      position: absolute; inset: -20%; pointer-events: none; opacity: 0; mix-blend-mode: screen;
      background: radial-gradient(40% 35% at 70% 30%, rgba(255,170,30,0.85), transparent 70%);
    }

    /* ---------- Ambient gold dust ---------- */
    .dust { position: absolute; border-radius: 50%; background: #FFD25E;
      box-shadow: 0 0 12px 4px rgba(255,180,40,0.7); pointer-events: none; }

    /* ---------- Intro ---------- */
    #intro { position: absolute; inset: 0; }
    .title {
      position: absolute; left: 0; right: 0; top: 330px; text-align: center;
      font-weight: 900; font-size: 168px; line-height: 0.95; letter-spacing: -0.04em;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .title .w { display: inline-block; }
    .title .gold { color: var(--gold); text-shadow: 0 0 40px var(--glow), 0 0 90px rgba(255,140,0,0.45); }
    .icons { position: absolute; left: 0; right: 0; top: 1130px; display: flex; justify-content: center; gap: 30px; }
    .icon { width: 310px; height: 310px; filter: drop-shadow(0 0 26px var(--glow)) drop-shadow(0 0 60px rgba(255,140,0,0.35)); }
    .icon img { width: 100%; height: 100%; }

    /* ---------- Scene badge (glowing icon + label) ---------- */
    .badge {
      position: absolute; left: 0; right: 0; top: 120px;
      display: flex; flex-direction: column; align-items: center; gap: 22px;
      opacity: 0;
    }
    .badge .icon { width: 260px; height: 260px; }
    .badge .label {
      font-weight: 900; font-size: 46px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #fff; padding: 12px 30px; border-radius: 999px;
      background: rgba(10,6,2,0.72); border: 3px solid var(--gold);
      box-shadow: 0 0 30px var(--glow);
    }
    .badge .label b { color: var(--gold); }

    /* ---------- Captions (karaoke, no box) ---------- */
    .caption {
      position: absolute; left: 60px; right: 60px; top: 1420px;
      text-align: center; opacity: 0;
      font-weight: 900; font-size: 88px; line-height: 1.08; letter-spacing: -0.02em;
      -webkit-text-stroke: 14px rgba(0,0,0,0.9); paint-order: stroke fill;
      text-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }
    .caption .w { display: inline-block; color: rgba(255,255,255,0.5); transform-origin: 50% 70%; }
    .caption .w.on { color: #fff; }
    .caption .w.hot { color: var(--gold); }
    .cta {
      position: absolute; left: 0; right: 0; top: 1700px; text-align: center; opacity: 0;
      font-weight: 800; font-size: 50px; color: #fff;
      -webkit-text-stroke: 10px rgba(0,0,0,0.85); paint-order: stroke fill;
    }
    .cta span { display: inline-block; color: var(--gold); }

    .progress { position: absolute; left: 0; bottom: 0; width: 100%; height: 10px; background: rgba(255,255,255,0.15); z-index: 40; }
    .progress > div { height: 100%; width: 100%; background: var(--gold); box-shadow: 0 0 14px var(--glow); transform-origin: 0 50%; transform: scaleX(0); }

    #play {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 99; font: 900 28px var(--font); padding: 18px 34px;
      border: 3px solid var(--gold); border-radius: 14px; background: #111; color: var(--gold); cursor: pointer;
    }
    body.render #play { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <!-- INTRO -->
    <div id="intro">
      <div class="title" id="title">
        <span class="w">Every</span><br><span class="w">runner</span><br><span class="w">has a</span><br><span class="w gold">reason.</span>
      </div>
      <div class="icons">
        <div class="icon"><img src="assets/v2/icon-cheetah.png"></div>
        <div class="icon"><img src="assets/v2/icon-gazelle.png"></div>
        <div class="icon"><img src="assets/v2/icon-cat.png"></div>
      </div>
    </div>

    <!-- Full-screen shots, stacked in play order: each fades in over the previous -->
    <div class="shot photo"   id="c1"><img src="assets/cheetah.jpg"></div>
    <div class="shot panel"   id="p1"><img src="assets/v2/panel-cheetah.jpg"></div>
    <div class="shot photo"   id="c2"><img src="assets/gazelle.jpg"></div>
    <div class="shot panel"   id="p2"><img src="assets/v2/panel-gazelle.jpg"></div>
    <div class="shot photo"   id="c3"><img src="assets/v2/cat-hd.jpg" style="object-position:50% 30%"></div>
    <div class="shot panel"   id="p3"><img src="assets/v2/panel-cat.jpg"></div>
    <div class="shot collage" id="outro"><img src="assets/v2/collage.jpg"></div>

    <div id="leak"></div>
    <div id="vignette"></div>
    <div id="topscrim"></div>
    <div id="scrim"></div>
    <div id="dustLayer"></div>

    <div class="badge" id="b1"><div class="icon"><img src="assets/v2/icon-cheetah.png"></div><div class="label"><b>01</b> · The Hunter</div></div>
    <div class="badge" id="b2"><div class="icon"><img src="assets/v2/icon-gazelle.png"></div><div class="label"><b>02</b> · The Survivor</div></div>
    <div class="badge" id="b3"><div class="icon"><img src="assets/v2/icon-cat.png"></div><div class="label"><b>03</b> · The Twist</div></div>

    <div class="caption" id="cap1"></div>
    <div class="caption" id="cap2"></div>
    <div class="caption" id="cap3a"></div>
    <div class="caption" id="cap3b"></div>
    <div class="caption" id="cap4"></div>
    <div class="cta" id="cta">Drop your reason in the comments <span>↓</span></div>

    <div class="progress"><div id="bar"></div></div>
  </div>

  <button id="play">▶ Play with voiceover</button>
  <audio id="vo" src="assets/voiceover.wav" preload="auto"></audio>

  <script>
    const DURATION = 15.0;
    const isRender = new URLSearchParams(location.search).has("render");
    if (isRender) document.body.classList.add("render");

    // Voiceover word timestamps (seconds); true = key word (gold)
    const WORDS = {
      cap1: [["The",2.22],["cheetah",2.30],["runs",2.60],["because",2.82],["he's",3.22],["hungry.",3.46,true]],
      cap2: [["The",4.54],["gazelle",4.68],["runs",5.02],["because",5.26],["he",5.62],["does",5.84],["not",5.96],["want",6.14],["to",6.36],["die.",6.46,true]],
      cap3a:[["And",7.64],["the",7.88],["cat?",8.00,true],["Pure",8.92],["chaos.",9.34,true]],
      cap3b:[["He",10.48],["runs",10.64],["because",10.86],["he",11.16],["just",11.34],["pooped.",11.50,true]],
      cap4: [["Tell",12.40],["me",12.84],["you've",12.98],["seen",13.12],["that",13.30],["3AM",13.46,true],["zoomie.",14.00,true]],
    };

    const tl = gsap.timeline({ paused: true });
    const XF = 0.85;              // slow crossfade length
    const SMOOTH = "sine.inOut";  // signature ease for camera moves and fades

    // ---------- helpers ----------
    function karaoke(id, tIn, tOut) {
      const el = document.getElementById(id);
      el.innerHTML = WORDS[id].map(([w]) => `<span class="w">${w}</span>`).join(" ");
      const spans = [...el.querySelectorAll(".w")];
      tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, tIn);
      tl.to(el, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, tOut - 0.4);
      WORDS[id].forEach(([, t, hot], i) => {
        const s = spans[i];
        tl.call(() => { s.classList.add("on"); if (hot) s.classList.add("hot"); }, null, t)
          .fromTo(s, { scale: 1 }, { scale: hot ? 1.1 : 1.04, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
      });
    }
    function fadeIn(sel, t, dur = XF) {
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: dur, ease: SMOOTH, immediateRender: false }, t);
    }
    function camera(sel, t, dur, from, to) { // slow Ken Burns on the shot's image
      tl.fromTo(`${sel} img`, from, { ...to, duration: dur, ease: SMOOTH, immediateRender: false }, t);
    }
    function badge(sel, tIn, tOut) {
      tl.fromTo(sel, { opacity: 0, y: -30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, tIn);
      tl.to(`${sel} .icon`, { scale: 1.05, duration: 0.9, ease: SMOOTH, yoyo: true, repeat: Math.max(1, Math.floor((tOut - tIn - 1.6) / 0.9)) }, tIn + 0.7);
      tl.to(sel, { opacity: 0, y: -20, duration: 0.6, ease: "power2.in" }, tOut - 0.6);
    }
    function leak(t) { // warm light flare riding each crossfade
      tl.fromTo("#leak", { opacity: 0, x: -120 }, { opacity: 0.55, x: 0, duration: XF / 2, ease: "sine.out", immediateRender: false }, t)
        .to("#leak", { opacity: 0, x: 120, duration: XF, ease: "sine.in" }, t + XF / 2);
    }

    // ---------- ambient: progress, gold dust, top scrim ----------
    tl.to("#bar", { scaleX: 1, duration: DURATION, ease: "none" }, 0);
    const dustLayer = document.getElementById("dustLayer");
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const dust = [];
    for (let i = 0; i < 26; i++) {
      const d = document.createElement("div"); d.className = "dust";
      const size = 4 + rnd() * 7; d.style.width = d.style.height = size + "px";
      d.style.left = (rnd() * 1080) + "px"; d.style.top = "0px";
      dustLayer.appendChild(d);
      dust.push({ d, period: 7 + rnd() * 6, phase: rnd(), sway: 30 + rnd() * 60, swayT: 2.5 + rnd() * 2, op: 0.25 + rnd() * 0.6 });
    }
    // ambient layer: a pure function of time, so every rendered frame is deterministic
    function updateDust(t) {
      for (const p of dust) {
        const k = ((t / p.period) + p.phase) % 1;
        const y = 1960 - k * 2020;
        const x = Math.sin((t / p.swayT + p.phase) * Math.PI * 2) * p.sway;
        const o = p.op * (0.6 + 0.4 * Math.sin((t * 1.3 + p.phase * 6.28))) * Math.min(1, k * 8, (1 - k) * 8);
        p.d.style.transform = `translate(${x}px, ${y}px)`; p.d.style.opacity = o;
      }
    }
    tl.eventCallback("onUpdate", () => updateDust(tl.time()));
    tl.to("#scrim", { opacity: 1, duration: 0.8, ease: SMOOTH }, 2.0);
    tl.to("#topscrim", { opacity: 1, duration: 0.8, ease: SMOOTH }, 2.0);

    // ===== INTRO 0 – 2.4 =====
    const tw = [...document.querySelectorAll("#title .w")];
    [0.0, 0.32, 0.68, 1.18].forEach((t, i) =>
      tl.from(tw[i], { y: 80, opacity: 0, duration: 0.55, ease: "power3.out" }, t));
    tl.from(".icons .icon", { y: 60, scale: 0.7, opacity: 0, duration: 0.7, stagger: 0.14, ease: "power3.out" }, 0.55);
    tl.to("#title .gold", { scale: 1.05, duration: 0.5, ease: SMOOTH, yoyo: true, repeat: 1 }, 1.3);
    tl.to("#intro", { scale: 1.08, opacity: 0, duration: XF, ease: SMOOTH }, 1.75);

    // ===== CHEETAH 1.75 – 4.6 =====
    fadeIn("#c1", 1.75); leak(1.75);
    camera("#c1", 1.75, 2.0, { scale: 1.0, yPercent: 0 }, { scale: 1.12, yPercent: -2 });   // he stalks toward us
    fadeIn("#p1", 2.75); leak(2.75);
    camera("#p1", 2.75, 2.3, { scale: 1.1, x: 60 }, { scale: 1.0, x: -40 });                 // settle onto the meal
    badge("#b1", 2.1, 4.5);
    karaoke("cap1", 2.15, 4.3);

    // ===== GAZELLE 4.15 – 7.5 =====
    fadeIn("#c2", 4.15); leak(4.15);
    camera("#c2", 4.15, 2.3, { scale: 1.0 }, { scale: 1.1 });
    fadeIn("#p2", 5.55); leak(5.55);
    camera("#p2", 5.55, 2.5, { scale: 1.08, x: 120 }, { scale: 1.0, x: -110 });              // pan with the leap
    badge("#b2", 4.55, 7.45);
    karaoke("cap2", 4.5, 7.3);

    // ===== CAT 7.15 – 12.3 =====
    fadeIn("#c3", 7.15); leak(7.15);
    camera("#c3", 7.15, 2.9, { scale: 1.0, transformOrigin: "50% 32%" }, { scale: 1.22, transformOrigin: "50% 32%" }); // slow suspicious push-in
    tl.to("#c3 img", { rotation: 1.6, duration: 0.11, ease: SMOOTH, yoyo: true, repeat: 5 }, 9.34);                   // "chaos" tremor
    fadeIn("#p3", 9.95); leak(9.95);
    camera("#p3", 9.95, 2.6, { scale: 1.1, x: 140 }, { scale: 1.0, x: -100 });               // from the evidence to the smug face
    badge("#b3", 7.6, 12.0);
    karaoke("cap3a", 7.55, 10.25);
    karaoke("cap3b", 10.35, 12.15);

    // ===== OUTRO 11.95 – 15 =====
    fadeIn("#outro", 11.95, 1.0); leak(11.95);
    camera("#outro", 11.95, 3.05, { scale: 1.18 }, { scale: 1.0 });                          // slow pull-back reveal
    karaoke("cap4", 12.3, 15.6);
    tl.fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 13.4);
    tl.to("#cta span", { y: 10, duration: 0.35, ease: SMOOTH, yoyo: true, repeat: 3 }, 14.0);

    tl.set({}, {}, DURATION);
    tl.seek(0);

    // ---------- deterministic seek API for render.js ----------
    window.__duration = DURATION;
    window.__seek = (t) => { tl.seek(t, false); };
    window.__ready = Promise.all([...document.images].map(i => i.decode().catch(() => {})))
      .then(() => document.fonts.ready);

    // ---------- preview ----------
    function fit() {
      if (isRender) return;
      const s = Math.min(innerWidth / 1080, innerHeight / 1920);
      document.getElementById("stage").style.transform = `translate(-50%,-50%) scale(${s})`;
    }
    addEventListener("resize", fit); fit();
    if (!isRender) {
      const vo = document.getElementById("vo");
      document.getElementById("play").onclick = (e) => {
        if (tl.time() > 1) { location.reload(); return; } // karaoke classes are forward-only
        e.target.style.display = "none";
        vo.currentTime = 0; vo.play().catch(() => {});
        const t0 = performance.now();
        const tick = () => {
          const t = vo.paused || vo.ended ? (performance.now() - t0) / 1000 : vo.currentTime;
          tl.seek(Math.min(t, DURATION), false);
          if (t < DURATION) requestAnimationFrame(tick);
          else { e.target.textContent = "↻ Replay"; e.target.style.display = "block"; }
        };
        tick();
      };
    }
  </script>
</body>
</html>
