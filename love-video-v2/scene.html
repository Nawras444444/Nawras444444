<!doctype html><html><head><meta charset="utf-8">

</head><body>
<svg id="s" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<canvas id="m" width="10" height="10" style="display:none"></canvas>
<script>
/* ============ palette (brand neutrals + flag colors; 60-30-10) ============ */
const INK="#141413",CREAM="#FAF9F5",GOLD="#F4B942",SAND="#E8C98B";
const GREEN="#006233",ARED="#D21034",BLUE="#0039A6",CRED="#D52B1E",WHITE="#FFFFFF";
const TOTAL=60,BPM=92,BEAT=60/BPM;
const C=x=>Math.min(1,Math.max(0,x));
const E=x=>1-Math.pow(1-C(x),3);
const IO=x=>{x=C(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const EB=x=>{if(x<=0)return 0;if(x>=1)return 1;return 1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2)};
const P=(t,a,d=.45)=>EB((t-a)/d);
const L=(t,a,b)=>C((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const R=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const W=1080;
const HEART="M0 30C-60-20-30-60 0-25C30-60 60-20 0 30Z";
const heart=(x,y,s,f=CRED,rot=0,o=1)=>s>0.001?`<path d="${HEART}" transform="translate(${x},${y}) rotate(${rot}) scale(${s})" fill="${f}" opacity="${o}"/>`:"";
const txt=(x,y,s,t,c=INK,a="middle",o=1,w=800,ex="")=>o>0.001?`<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${a}" opacity="${o}" ${ex}>${t}</text>`:"";
const ring=(x,y,t,t0,col=CRED,max=380,w=14)=>{const k=L(t,t0,t0+.9);return k>0&&k<1?`<circle cx="${x}" cy="${y}" r="${40+E(k)*max}" fill="none" stroke="${col}" stroke-width="${w*(1-k)+1}" opacity="${1-k}"/>`:""};
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const ALG=[3.0588,36.7539],SCL=[-70.6693,-33.4489];
let T=0;

/* ============ time map: narration is placed in 3 parts ============ */
const U2T=u=>u+(u<13.8?7.2:u<30.8?14.2:23.2);
const OFFAT=t=>t<28?7.2:t<54?14.2:23.2;
const BOUND=[6.8,11,16,21,28,34.1,40.5,45,54];

/* ============ flags ============ */
function star5(cx,cy,R1,rot=-90){let p=[];for(let i=0;i<10;i++){const a=(rot+i*36)*Math.PI/180,r=i%2?R1*.382:R1;p.push((cx+Math.cos(a)*r).toFixed(1)+","+(cy+Math.sin(a)*r).toFixed(1))}return p.join(" ")}
const FLAGDEFS=`<defs>
<clipPath id="fclip"><rect width="300" height="200" rx="16"/></clipPath>
<g id="fA"><rect width="150" height="200" fill="${GREEN}"/><rect x="150" width="150" height="200" fill="#fff"/>
 <circle cx="146" cy="100" r="58" fill="${ARED}"/><circle cx="160" cy="100" r="47" fill="#fff"/>
 <polygon points="${star5(163,100,28,-18)}" fill="${ARED}"/></g>
<g id="fC"><rect width="300" height="100" fill="#fff"/><rect y="100" width="300" height="100" fill="${CRED}"/>
 <rect width="100" height="100" fill="${BLUE}"/><polygon points="${star5(50,50,30)}" fill="#fff"/></g>
</defs>`;
function flag(kind,x,y,sc,t,wave=1,rot=0,o=1){
  const n=20,sw=15;let s="";
  for(let i=0;i<n;i++){const dy=Math.sin(t*4.2-i*.5)*7*wave*(.25+i/n*.75);
    s+=`<svg x="${i*sw}" y="${dy}" width="${sw+.8}" height="200" viewBox="${i*sw} 0 ${sw+.8} 200" overflow="hidden"><use href="#${kind}"/></svg>`}
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc}) translate(-150,-100)" opacity="${o}"><rect x="6" y="14" width="300" height="200" rx="16" fill="#000" opacity=".12"/><g clip-path="url(#fclip)">${s}</g><rect x="-10" y="-14" width="10" height="260" rx="5" fill="${INK}"/></g>`;
}
const miniflag=(kind,x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc}) translate(-150,-100)"><g clip-path="url(#fclip)"><use href="#${kind}"/></g></g>`;

/* ============ characters ============ */
const PA={skin:"#D6A171",hair:"#1D1511",top:GREEN,acc:"#FFFFFF",accTrim:ARED,pants:"#2B2B36",shoe:ARED,long:true,emb:"crescent"};
const PB={skin:"#EFC29B",hair:"#5B3A26",top:BLUE,acc:CRED,accTrim:"#FFFFFF",pants:"#2B2B36",shoe:"#FFFFFF",long:false,emb:"star"};
const mk=o=>Object.assign({x:0,y:0,s:1,face:1,armL:8,armR:8,waveL:0,waveR:0,ph:0,smile:.55,lean:0,jump:0,heartEyes:0,hold:"",seed:0,vis:1},o||{});
function person(c,who){
  if(c.vis<=0.001)return"";
  const p=who==="A"?PA:PB, sw=Math.sin(c.ph*Math.PI), cw=Math.cos(c.ph*Math.PI);
  const bob=-Math.abs(sw)*7+Math.sin(T*2.4+c.seed)*2.2;
  const blinkK=(()=>{const q=((T+c.seed*.7)%3.4);return q<.14?Math.abs(Math.cos(q/.14*Math.PI/2)):1})();
  const armAng=(side)=>{const w=side<0?c.waveL:c.waveR, base=side<0?c.armL:c.armR; return base+w*(115+Math.sin(T*9+c.seed)*26)};
  const hand=(side)=>{const th=armAng(side)*Math.PI/180,sx=side*56,sy=-226,Lg=100;return [sx+side*Math.sin(th)*Lg,sy+Math.cos(th)*Lg,sx,sy]};
  const hl=hand(-1),hr=hand(1);
  const arm=(h,side)=>{const mx=(h[0]+h[2])/2,my=(h[1]+h[3])/2;return `<line x1="${h[2]}" y1="${h[3]}" x2="${mx}" y2="${my}" stroke="${p.top}" stroke-width="30" stroke-linecap="round"/><line x1="${mx}" y1="${my}" x2="${h[0]}" y2="${h[1]}" stroke="${p.skin}" stroke-width="22" stroke-linecap="round"/><circle cx="${h[0]}" cy="${h[1]}" r="14" fill="${p.skin}"/>`};
  const fl={x:-18+sw*28,y:-Math.max(0,cw)*16}, fr={x:18-sw*28,y:-Math.max(0,-cw)*16};
  let item="";
  if(c.hold==="suitcase"){const x=hr[0]+10,y=hr[1]+4;item=`<g transform="translate(${x},${y})"><rect x="-6" y="-14" width="12" height="10" rx="4" fill="none" stroke="${INK}" stroke-width="5"/><rect x="-50" y="-4" width="100" height="78" rx="12" fill="${CRED}"/><rect x="-30" y="-4" width="9" height="78" fill="${CREAM}" opacity=".55"/><rect x="21" y="-4" width="9" height="78" fill="${CREAM}" opacity=".55"/><rect x="-50" y="30" width="100" height="6" fill="${INK}" opacity=".15"/></g>`}
  if(c.hold==="phone"){const x=hl[0]-4,y=hl[1]-22;item=`<g transform="translate(${x},${y}) rotate(-8)"><rect x="-16" y="-30" width="32" height="56" rx="7" fill="${INK}"/><rect x="-12" y="-25" width="24" height="44" rx="4" fill="${GOLD}"/>${heart(0,-4,.32,CRED)}</g>`}
  if(c.hold==="bigheart"){item=`${heart((hl[0]+hr[0])/2,(hl[1]+hr[1])/2-8,2.2*c.hs||2.2,CRED)}`}
  let eyes;
  if(c.heartEyes>.01) eyes=heart(-19,-304,.28*c.heartEyes*(1+.1*Math.sin(T*10)),CRED)+heart(19,-304,.28*c.heartEyes*(1+.1*Math.sin(T*10)),CRED);
  else eyes=`<ellipse cx="-19" cy="-298" rx="6.5" ry="${7*blinkK}" fill="${INK}"/><ellipse cx="19" cy="-298" rx="6.5" ry="${7*blinkK}" fill="${INK}"/>`;
  const sm=c.smile, mouth=sm>.6?`<path d="M-16,-276 Q0,${-276+34*sm} 16,-276Z" fill="#7A1F2B"/>`:`<path d="M-14,-275 Q0,${-275+26*sm} 14,-275" fill="none" stroke="#7A1F2B" stroke-width="5" stroke-linecap="round"/>`;
  const hairBack=p.long?`<path d="M-58,-292 Q-66,-356 0,-358 Q66,-356 58,-292 Q70,-212 42,-196 L-42,-196 Q-70,-212 -58,-292Z" fill="${p.hair}"/>`:"";
  const hairFront=p.long?`<path d="M-52,-300 Q-44,-350 0,-350 Q44,-350 52,-300 Q26,-326 0,-322 Q-26,-326 -52,-300Z" fill="${p.hair}"/>`:`<path d="M-54,-298 Q-60,-360 0,-360 Q60,-360 54,-298 Q42,-330 6,-326 Q-30,-330 -54,-298Z" fill="${p.hair}"/><path d="M-6,-356 Q22,-378 40,-352 Q20,-352 -6,-356Z" fill="${p.hair}"/>`;
  const emb=p.emb==="crescent"?`<circle cx="-24" cy="-190" r="17" fill="#fff"/><circle cx="-24" cy="-190" r="11" fill="${ARED}"/><circle cx="-20" cy="-190" r="9" fill="#fff"/>`:`<circle cx="-24" cy="-190" r="17" fill="#fff"/><polygon points="${star5(-24,-189,12)}" fill="${BLUE}"/>`;
  return `<g transform="translate(${c.x},${c.y-c.jump}) scale(${c.face*c.s},${c.s})">
   <ellipse cx="0" cy="4" rx="${78-Math.abs(c.jump)*.25}" ry="13" fill="#000" opacity=".12"/>
   <g transform="translate(0,${bob*.3})">
    <line x1="-18" y1="-112" x2="${fl.x}" y2="${fl.y-14}" stroke="${p.pants}" stroke-width="28" stroke-linecap="round"/>
    <line x1="18" y1="-112" x2="${fr.x}" y2="${fr.y-14}" stroke="${p.pants}" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="${fl.x+8}" cy="${fl.y-6}" rx="26" ry="13" fill="${p.shoe}" stroke="${INK}" stroke-opacity=".15"/><ellipse cx="${fr.x+8}" cy="${fr.y-6}" rx="26" ry="13" fill="${p.shoe}" stroke="${INK}" stroke-opacity=".15"/>
    <g transform="translate(0,${bob}) rotate(${c.lean},0,-110)">
     ${hairBack}
     ${arm(hl,-1)}
     <path d="M-60,-226 Q-60,-246 -40,-246 H40 Q60,-246 60,-226 L50,-104 H-50Z" fill="${p.top}"/>${emb}
     <ellipse cx="0" cy="-238" rx="54" ry="17" fill="${p.acc}"/><path d="M14,-232 L40,-170 L22,-164 L6,-224Z" fill="${p.acc}"/><path d="M-52,-238 Q0,-216 52,-238" fill="none" stroke="${p.accTrim}" stroke-width="5" opacity=".9"/>
     <circle cx="0" cy="-292" r="52" fill="${p.skin}"/><circle cx="-31" cy="-280" r="10" fill="#F2706A" opacity=".32"/><circle cx="31" cy="-280" r="10" fill="#F2706A" opacity=".32"/>
     ${hairFront}${eyes}
     <path d="M-30,-318 Q-19,-326 -8,-320 M8,-320 Q19,-326 30,-318" fill="none" stroke="${p.hair}" stroke-width="4" stroke-linecap="round"/>
     ${mouth}
     ${arm(hr,1)}
    </g>${item}
   </g></g>`;
}
function bust(x,y,s,skin,hair,top,style){
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-46,40 Q-46,0 0,0 Q46,0 46,40Z" fill="${top}"/><circle cy="-26" r="27" fill="${skin}"/>${style==="long"?`<path d="M-30,-28 Q-32,-62 0,-62 Q32,-62 30,-28 Q34,4 22,8 L-22,8 Q-34,4 -30,-28Z" fill="${hair}" opacity=".95"/><circle cy="-26" r="22" fill="${skin}"/><path d="M-22,-36 Q0,-58 22,-36 Q0,-46 -22,-36Z" fill="${hair}"/>`:`<path d="M-27,-30 Q-30,-60 0,-60 Q30,-60 27,-30 Q16,-46 0,-44 Q-16,-46 -27,-30Z" fill="${hair}"/>`}<circle cx="-9" cy="-26" r="3" fill="${INK}"/><circle cx="9" cy="-26" r="3" fill="${INK}"/><path d="M-8,-14 Q0,-8 8,-14" fill="none" stroke="#7A1F2B" stroke-width="3" stroke-linecap="round"/></g>`;
}

/* ============ choreography via Anime.js timeline (seekable) ============ */
const CS={};["intro","s1","s2","s3","s4","s5","s6","s7"].forEach(k=>CS[k]={A:mk({seed:1}),B:mk({seed:2.3,face:-1})});
const FS={fa:{y:-420,s:1},fb:{y:-420,s:1},ti:{a:0,b:0,h:0,sub:0}};
const TL=anime.createTimeline({autoplay:false,defaults:{ease:"outCubic"}});
const tw=(o,props,at,dur,ease="outCubic")=>{const p={duration:dur*1000,ease};for(const k in props)p[k]=props[k];TL.add(o,p,at*1000)};
const hop=(o,at,h=46)=>{tw(o,{jump:[0,h]},at,.2,"outQuad");tw(o,{jump:[h,0]},at+.2,.24,"inQuad")};
const A_=(k)=>CS[k].A, B_=(k)=>CS[k].B;
function choreo(){
  // intro
  tw(FS.fa,{y:[-420,0]},.2,1.1,"outBounce");tw(FS.fb,{y:[-420,0]},.55,1.1,"outBounce");
  tw(FS.ti,{a:[0,1]},1.0,.9,"outBack(1.4)");tw(FS.ti,{b:[0,1]},1.4,.9,"outBack(1.4)");tw(FS.ti,{h:[0,1]},1.9,.7,"outElastic(1,.5)");tw(FS.ti,{sub:[0,1]},3.2,.8,"outCubic");
  let a=A_("intro"),b=B_("intro");
  a.y=1440;b.y=1440;a.s=1.0;b.s=1.0;
  tw(a,{x:[-220,290],ph:[0,10]},1.2,2.6,"inOutCubic");tw(b,{x:[1300,790],ph:[0,10]},1.2,2.6,"inOutCubic");
  tw(a,{waveR:[0,1]},3.8,.4);tw(b,{waveR:[0,1]},4.1,.4);tw(a,{smile:[.5,1]},3.8,.3);tw(b,{smile:[.5,1]},3.8,.3);
  tw(a,{heartEyes:[0,1]},5.5,.3);tw(b,{heartEyes:[0,1]},5.6,.3);tw(a,{waveR:[1,0]},5.5,.3);tw(b,{waveR:[1,0]},5.6,.3);
  // s1  (u time + 7.2)
  a=A_("s1");b=B_("s1");a.x=150;b.x=930;a.y=1250;b.y=1250;a.s=.5;b.s=.5;a.hold="phone";b.hold="phone";
  tw(a,{smile:[.5,1]},U2T(2.58),.2);tw(b,{smile:[.5,1]},U2T(2.58),.2);hop(a,U2T(2.58),30);hop(b,U2T(2.62),30);
  // s2
  a=A_("s2");b=B_("s2");a.y=1265;b.y=1265;a.s=.95;b.s=.95;a.hold="suitcase";
  tw(a,{x:[-160,240]},U2T(3.9),1.0,"outCubic");tw(a,{ph:[0,6]},U2T(3.9),1.0,"outCubic");tw(b,{x:[1240,840]},U2T(4.1),1.0,"outCubic");tw(b,{ph:[0,6]},U2T(4.1),1.0,"outCubic");
  tw(a,{waveL:[0,1]},U2T(5.2),.3);tw(b,{waveR:[0,1]},U2T(5.2),.3);tw(a,{smile:[.55,.2]},U2T(6.5),.5);tw(b,{smile:[.55,.2]},U2T(6.5),.5);
  // s3
  a=A_("s3");b=B_("s3");a.x=250;b.x=830;a.y=1265;b.y=1265;a.s=.95;b.s=.95;
  tw(a,{smile:[.55,1]},U2T(9.3),.3);tw(b,{smile:[.55,1]},U2T(9.3),.3);tw(a,{armR:[8,70]},U2T(9.4),.4);tw(b,{armL:[8,70]},U2T(9.5),.4);
  hop(a,U2T(12.98),50);hop(b,U2T(13.02),50);tw(a,{heartEyes:[0,1]},U2T(12.98),.2);tw(b,{heartEyes:[0,1]},U2T(13.02),.2);
  // s4
  a=A_("s4");b=B_("s4");a.x=150;b.x=930;a.y=1265;b.y=1265;a.s=.85;b.s=.85;a.smile=.12;b.smile=.12;a.lean=-3;b.lean=3;
  tw(a,{lean:[-3,-10]},U2T(15.88),.5);tw(b,{lean:[3,10]},U2T(15.88),.5);
  tw(a,{smile:[.12,1]},U2T(19.3),.2);tw(b,{smile:[.12,1]},U2T(19.3),.2);hop(a,U2T(19.3),44);hop(b,U2T(19.34),44);tw(a,{heartEyes:[0,1]},U2T(19.3),.2);tw(b,{heartEyes:[0,1]},U2T(19.34),.2);
  // s5
  a=A_("s5");b=B_("s5");a.x=230;b.x=850;a.y=1265;b.y=1265;a.s=.9;b.s=.9;a.smile=.8;b.smile=.8;
  tw(a,{waveR:[0,1]},U2T(23.7),.3);tw(b,{waveL:[0,1]},U2T(24.1),.3);hop(a,U2T(25.9),36);hop(b,U2T(25.95),36);
  // s6
  a=A_("s6");b=B_("s6");a.x=160;b.x=920;a.y=1265;b.y=1265;a.s=.78;b.s=.78;a.hold="phone";b.hold="phone";
  tw(a,{heartEyes:[0,1]},U2T(30.3),.2);tw(b,{heartEyes:[0,1]},U2T(30.3),.2);hop(a,U2T(30.3),40);hop(b,U2T(30.34),40);
  // s7
  a=A_("s7");b=B_("s7");a.x=345;b.x=735;a.y=1200;b.y=1200;a.s=1.05;b.s=1.05;b.face=-1;a.armL=150;a.armR=150;b.armL=150;b.armR=150;
  tw(a,{smile:[.5,1]},54.3,.3);tw(b,{smile:[.5,1]},54.3,.3);tw(a,{heartEyes:[0,1]},54.42,.2);tw(b,{heartEyes:[0,1]},54.42,.2);
  hop(a,54.42,52);hop(b,54.46,52);hop(a,55.5,40);hop(b,55.54,40);hop(a,57,36);hop(b,57.04,36);
  tw(FS,{y:[0,0]},TOTAL-.5,.5); // keeps timeline length
}

/* ============ geo ============ */
let WORLD=null,LAND=null,CTRY=null,ALGF=null,CHLF=null,GRAT=d3.geoGraticule10();
function setWorld(w){WORLD=w;LAND=topojson.feature(w,w.objects.land);CTRY=topojson.feature(w,w.objects.countries);
 ALGF=CTRY.features.find(f=>f.id==="012");CHLF=CTRY.features.find(f=>f.id==="152")}
const ROUTE=d3.geoInterpolate(ALG,SCL), DIST=d3.geoDistance(ALG,SCL)*6371;
const routeLine=(k,n=90)=>({type:"LineString",coordinates:Array.from({length:Math.max(2,Math.ceil(n*k)+1)},(_,i)=>ROUTE(Math.min(k,i/n)))});
const vis=(proj,pt)=>{const r=proj.rotate();return d3.geoDistance(pt,[-r[0],-r[1]])<Math.PI/2-.02};

/* ============ background ============ */
const KF=[[0,.6,.6,.1,.2],[6.8,.6,.55,.1,.2],[11,.85,.2,.1,.2],[16,.5,.5,.1,.3],[21,.3,.85,.1,.1],[28,.5,.5,.35,.1],[34.1,.5,.5,.1,.35],[40.5,.45,.45,.45,.3],[45,.2,.2,.1,.15],[54,.5,.5,.7,.5],[60,.5,.5,.7,.5]];
function weights(t){let i=0;while(i<KF.length-2&&t>=KF[i+1][0])i++;const a=KF[i],b=KF[i+1],k=IO((t-a[0])/(b[0]-a[0]));return[1,2,3,4].map(j=>lerp(a[j],b[j],k))}
function ridge(y0,amp,f,ph,x0,x1,fill,op=1){let d=`M${x0} 1930 L${x0} ${y0}`;for(let x=x0;x<=x1;x+=16){const y=y0-amp*(.55+.45*Math.sin(x*f+ph)+.25*Math.sin(x*f*2.3+ph*1.7));d+=` L${x} ${y.toFixed(1)}`}return `<path d="${d} L${x1} 1930Z" fill="${fill}" opacity="${op}"/>`}
function peaks(pts,base,fill,cap){let d=`M${pts[0][0]-120} 1930 L${pts[0][0]-120} ${base}`,c="";pts.forEach(p=>{d+=` L${p[0]-90} ${base} L${p[0]} ${p[1]} L${p[0]+90} ${base}`;if(cap)c+=`<path d="M${p[0]} ${p[1]} L${p[0]-26} ${p[1]+44} L${p[0]-8} ${p[1]+34} L${p[0]+4} ${p[1]+52} L${p[0]+14} ${p[1]+36} L${p[0]+28} ${p[1]+46}Z" fill="#fff" opacity=".85"/>`});return `<path d="${d} L${pts[pts.length-1][0]+120} ${base} L${pts[pts.length-1][0]+120} 1930Z" fill="${fill}"/>${c}`}
function bg(t){
  const w=weights(t),bp=(t%BEAT)/BEAT,pulse=Math.exp(-bp*5)*.05,px=Math.sin(t*.25)*14;
